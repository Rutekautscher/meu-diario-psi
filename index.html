<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NETPSI - Diário Terapêutico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #141414; color: #e5e5e5; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .login-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; }
        .netpsi-logo { font-size: 4rem; font-weight: 900; color: #E50914; text-shadow: 0 0 15px rgba(229,9,20,0.5); text-align: center; }
        .tagline { font-size: 1rem; color: #ccc; text-align: center; margin: 0.5rem 0; }
        .producer { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 2rem; }
        .login-card { background: rgba(0,0,0,0.8); border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .login-card h2 { margin-bottom: 1rem; font-size: 1.5rem; color: white; }
        .input-group { margin-bottom: 1rem; }
        .input-group input { width: 100%; padding: 0.8rem; background: #333; border: none; border-radius: 8px; color: white; font-size: 1rem; }
        .input-group input:focus { outline: none; box-shadow: 0 0 0 2px #E50914; }
        .btn-red { background: #E50914; color: white; border: none; padding: 0.8rem; font-size: 1rem; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 0.5rem; transition: all 0.2s; }
        .btn-red:hover { background: #f6121d; transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid #E50914; color: #E50914; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .btn-outline:hover { background: rgba(229,9,20,0.15); }
        .switch-btn { background: none; border: none; color: #b3b3b3; margin-top: 1rem; cursor: pointer; width: 100%; }
        .switch-btn:hover { color: #E50914; }
        .error-msg { color: #E50914; font-size: 0.75rem; margin-top: 0.5rem; text-align: center; }
        .login-footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #b3b3b3; font-style: italic; line-height: 1.5; }
        .dashboard { display: none; padding-bottom: 2rem; }
        .nav-bar { background: linear-gradient(to bottom, #000000cc, #141414); padding: 0.8rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 0.5rem; position: sticky; top: 0; z-index: 100; }
        .nav-logo { font-size: 1.5rem; font-weight: bold; color: #E50914; letter-spacing: -1px; }
        .page-nav { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .page-btn { background: transparent; border: none; color: #aaa; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.7rem; border-radius: 20px; transition: all 0.2s; }
        .page-btn.active { background: #E50914; color: white; }
        .page-btn:hover:not(.active) { background: rgba(229,9,20,0.3); color: white; }
        .user-info { display: flex; align-items: center; gap: 0.8rem; }
        .avatar { width: 36px; height: 36px; background: #000; border: 2px solid #E50914; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; color: #E50914; }
        .btn-logout { background: #E50914; border: none; color: white; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 0.75rem; }
        .save-bar { background: #1f1f1f; padding: 0.8rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; border-bottom: 1px solid #333; }
        .btn-save { background: #E50914; color: white; border: none; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .history-select { background: #333; color: white; padding: 0.3rem 0.6rem; border-radius: 20px; border: none; font-size: 0.7rem; }
        .page-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        .section { background: #1f1f1f; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #E50914; }
        .section h3 { color: #E50914; margin-bottom: 0.5rem; font-size: 1rem; font-weight: 600; }
        .hidden { display: none; }
        .two-columns { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem; }
        @media (min-width: 768px) { .two-columns { grid-template-columns: 1fr 1fr; } .page-btn { font-size: 0.8rem; padding: 0.4rem 1rem; } }
        input, textarea { background: #2a2a2a; border: none; padding: 0.5rem; color: white; border-radius: 8px; width: 100%; font-size: 0.85rem; font-family: inherit; margin-bottom: 0.5rem; }
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px #E50914; }
        textarea { resize: vertical; min-height: 60px; }
        .checklist-vertical { display: flex; flex-direction: column; gap: 0.3rem; }
        .checklist-vertical label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; cursor: pointer; }
        .checklist-vertical input { width: auto; margin-bottom: 0; }
        .estrela-options { display: flex; gap: 1rem; margin: 0.5rem 0; flex-wrap: wrap; }
        .estrela-option { background: #2a2a2a; padding: 0.3rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .estrela-option.selected { background: #E50914; color: white; }
        .tv-smart { background: #2a2a2a; border-radius: 20px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s; border: 1px solid #E50914; margin-bottom: 0.5rem; }
        .tv-smart:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(229,9,20,0.3); }
        .tv-screen { background: #0a0a0a; border-radius: 10px; padding: 0.8rem; margin-bottom: 0.5rem; }
        .tv-screen span { font-size: 0.9rem; font-weight: 500; color: #E50914; }
        .tv-stand { width: 50px; height: 6px; background: #444; margin: 0 auto; border-radius: 4px; }
        .emo-acordeon { margin-bottom: 0.5rem; }
        .emo-header { background: #2a2a2a; padding: 0.5rem; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .emo-header h4 { margin: 0; color: #E50914; font-size: 0.85rem; }
        .emo-content { display: none; padding: 0.5rem; background: #252525; border-radius: 8px; margin-top: 0.3rem; }
        .emo-content.open { display: block; }
        .emo-question { margin-bottom: 0.5rem; }
        .emo-question label { font-size: 0.7rem; color: #aaa; display: block; margin-bottom: 0.2rem; }
        .text-small { font-size: 0.7rem; color: #aaa; }
        .blocked-message { text-align: center; padding: 2rem; background: #1f1f1f; border-radius: 16px; color: #E50914; }
        .info-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; margin-bottom: 0.8rem; }
        .info-card h4 { color: #E50914; margin-bottom: 0.3rem; font-size: 0.85rem; }
        .vhs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
        .vhs-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-radius: 12px; padding: 0.8rem; cursor: pointer; transition: all 0.2s; border: 1px solid #E50914; text-align: center; position: relative; overflow: hidden; }
        .vhs-card::before { content: "SIDE A LOW QUALITY NOISE TAPE"; position: absolute; bottom: 4px; left: 6px; font-size: 0.5rem; color: #666; opacity: 0.6; white-space: nowrap; }
        .vhs-card:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(229,9,20,0.3); }
        .vhs-date { font-size: 0.85rem; font-weight: 600; color: #E50914; margin-bottom: 0.3rem; }
        .grid-emocoes { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
        @media (min-width: 640px) { .grid-emocoes { grid-template-columns: repeat(2, 1fr); } }
        .ikigai-container { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin: 1rem 0; }
        .ikigai-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; }
        .ikigai-sphere { background: #1f1f1f; border: 2px solid #E50914; border-radius: 20px; padding: 0.8rem; width: 220px; text-align: center; }
        .ikigai-title { font-size: 0.75rem; font-weight: 500; margin-bottom: 0.5rem; color: #ccc; }
        .circle-btn { width: 30px; height: 30px; border-radius: 50%; background: #2a2a2a; border: 1px solid #E50914; color: #E50914; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; margin: 0.2rem; }
        .circle-btn:hover { background: #E50914; color: white; transform: scale(1.05); }
        .ikigai-subtitle { font-size: 0.7rem; color: #E50914; margin-top: 0.3rem; }
        .quarteto-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin: 1rem 0; }
        @media (min-width: 768px) { .quarteto-grid { grid-template-columns: repeat(2, 1fr); } }
        .quarteto-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; border-left: 3px solid #E50914; }
        .quarteto-card h4 { color: #E50914; font-size: 0.85rem; margin-bottom: 0.2rem; }
        .quarteto-card p { font-size: 0.7rem; color: #ccc; }
        .camera-container { display: flex; justify-content: center; margin: 1.5rem 0; }
        .camera-box { background: #1f1f1f; border: 3px solid #E50914; border-radius: 16px; padding: 1rem; width: 100%; max-width: 400px; text-align: center; position: relative; }
        .camera-box::before { content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 50px; height: 25px; background: #E50914; border-radius: 8px 8px 0 0; }
        .camera-lens { background: #0a0a0a; width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 0.5rem; display: flex; align-items: center; justify-content: center; border: 2px solid #E50914; }
        .roda-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin: 1rem 0; }
        @media (min-width: 768px) { .roda-grid { grid-template-columns: repeat(2, 1fr); } }
        .roda-item { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; }
        .roda-item h4 { color: #E50914; font-size: 0.85rem; margin-bottom: 0.2rem; }
        .roda-item p { font-size: 0.65rem; color: #aaa; margin-bottom: 0.3rem; }
        .esferas-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
        @media (min-width: 768px) { .esferas-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); } }
        .esfera-card { background: #1f1f1f; border-radius: 12px; padding: 0.8rem; border-left: 4px solid #E50914; }
        .esfera-card h4 { color: #E50914; font-size: 0.85rem; margin-bottom: 0.3rem; }
        .esfera-desc { font-size: 0.7rem; color: #aaa; margin-bottom: 0.5rem; cursor: pointer; }
        .desc-full { display: none; font-size: 0.65rem; color: #ccc; margin-bottom: 0.5rem; padding: 0.4rem; background: #2a2a2a; border-radius: 8px; }
        .desc-full.open { display: block; }
        .hormonios-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin-top: 0.5rem; }
        @media (min-width: 768px) { .hormonios-grid { grid-template-columns: repeat(2, 1fr); } }
        .hormonio-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; }
        .hormonio-card h4 { color: #E50914; font-size: 0.85rem; margin-bottom: 0.3rem; }
        .hormonio-desc { font-size: 0.7rem; margin: 0.3rem 0; color: #ccc; }
        .hormonio-check { display: block; margin: 0.2rem 0; font-size: 0.7rem; }
        .hormonio-check input { width: auto; margin-right: 0.3rem; }
        input[type="range"] { width: 100%; margin: 0.3rem 0; background: #333; height: 3px; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #E50914; cursor: pointer; }
        .rating-value { font-size: 0.65rem; color: #E50914; margin-left: 0.3rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: #1f1f1f; border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 1rem; border-left: 4px solid #E50914; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; color: #E50914; }
        .close-modal { cursor: pointer; font-size: 1.3rem; }
    </style>
</head>
<body>
<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">Dados sigilosos,<br>aqui ninguém assiste sua série,<br>suas emoções são apenas suas.</div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-logo">NETPSI</div>
        <div class="page-nav" id="pageNav"></div>
        <div class="user-info"><div class="avatar" id="avatarBtn">N</div><span id="currentUserDisplay"></span><button class="btn-logout" id="logoutBtn">Sair</button></div>
    </div>
    <div class="save-bar"><button class="btn-save" id="saveEntryBtn">Salvar episódio de hoje</button><select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select></div>
    <div id="page0" class="page-container"></div>
    <div id="page1" class="page-container hidden"></div>
    <div id="page2" class="page-container hidden"></div>
    <div id="page3" class="page-container hidden"></div>
    <div id="page4" class="page-container hidden"></div>
    <div id="page5" class="page-container hidden"></div>
    <div id="page6" class="page-container hidden"></div>
    <div id="page7" class="page-container hidden"></div>
    <div id="page8" class="page-container hidden"></div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
    let currentUser = null;
    let currentDate = new Date().toISOString().slice(0,10);
    let currentPage = 0;
    const pageNames = ["EPISÓDIO", "CINEMOÇÕES", "PIPOCA", "PIPOQUEIRA", "NEURO FLIX", "COADJUVANTES", "DIAGNOSTIFLIX", "IKIGAI FLIX", "ARQUIVOS"];
    const pageKeys = ['page0','page1','page2','page3','page4','page5','page6','page7','page8'];
    
    const emocoesList = ["Alegria","Tédio","Medo","Raiva","Tristeza","Nojo","Frustração","Apatia","Vergonha","Ressentimento","Inveja","Carência","Esperança","Alívio","Amor","Paixão","Impulso","Orgulho","Solidão","Paciência"];
    
    function getEmptyDiary() {
        let emocoes = {};
        emocoesList.forEach(e => { emocoes[e] = { intensidade: 0, gatilho: "", pensamentos: "", outra_forma: "", descricao: "" }; });
        return {
            estrela: "", estrela_roteiro: "", diario_texto: "",
            checklist_fisica: { banho:false, dentes:false, agua:false, comida:false, sol:false, movimento:false },
            checklist_autocuidado: { medicamentos:false, terapia:false, amorProprio:false, limites:false, ajuda:false, detox:false, skincare:false, arrumarCama:false, hobby:false },
            elogios: ["","",""], gratidao: ["","",""], sofa_preguica: "", hd_sigiloso: "", emocoes: emocoes,
            ikigai_respostas: {}, ikigai_data: null, roda_vida: null, roda_vida_data: null, coadjuvantes: {}, saga: {}, pipoca: {}
        };
    }
    
    function saveAll() { if(currentUser) localStorage.setItem('netpsi_users', JSON.stringify(users)); }
    
    function changePage(page) {
        currentPage = page;
        for(let i=0;i<pageKeys.length;i++) document.getElementById(pageKeys[i]).classList.add('hidden');
        document.getElementById(pageKeys[page]).classList.remove('hidden');
        document.querySelectorAll('.page-btn').forEach((btn,idx)=>{ if(idx==page) btn.classList.add('active'); else btn.classList.remove('active'); });
        if(page===1) renderPagina1();
        if(page===2) renderPagina2();
        if(page===3) renderPagina3();
        if(page===4) renderPagina4();
        if(page===5) renderPagina5();
        if(page===6) renderRodaVida();
        if(page===7) renderIkigai();
        if(page===8) renderArquivos();
    }
    
    function renderPagina0() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        document.getElementById('page0').innerHTML = `
            <div class="section"><h3>EXERCÍCIO TERAPÊUTICO</h3><div class="tv-smart" id="exercicioBtn"><div class="tv-screen">CLIQUE AQUI<br>PARA SEU EXERCÍCIO</div></div><textarea id="reflexaoTexto" rows="3" placeholder="Escreva sua reflexão...">${data.reflexao||""}</textarea></div>
            <div class="section"><div class="tv-smart" id="tvSmartBtn"><div class="tv-screen">TV<br>COMO FOI O EPISÓDIO DE HOJE?</div><div class="tv-stand"></div></div></div>
            <div class="section"><h3>Como está sua estrela hoje?</h3><div class="estrela-options"><div class="estrela-option ${data.estrela==='brilhando'?'selected':''}" data-estrela="brilhando">Brilhando</div><div class="estrela-option ${data.estrela==='apagada'?'selected':''}" data-estrela="apagada">Apagada</div></div><textarea id="estrelaRoteiro" placeholder="Descreva o roteiro...">${data.estrela_roteiro}</textarea></div>
            <div class="two-columns"><div class="section"><h3>Checklist Saúde Física</h3><div class="checklist-vertical"><label><input type="checkbox" id="fis_banho" ${data.checklist_fisica.banho?'checked':''}> Tomei banho</label><label><input type="checkbox" id="fis_dentes" ${data.checklist_fisica.dentes?'checked':''}> Escovei dentes</label><label><input type="checkbox" id="fis_agua" ${data.checklist_fisica.agua?'checked':''}> Bebi água</label><label><input type="checkbox" id="fis_comida" ${data.checklist_fisica.comida?'checked':''}> Comi bem</label><label><input type="checkbox" id="fis_sol" ${data.checklist_fisica.sol?'checked':''}> Tomei sol</label><label><input type="checkbox" id="fis_movimento" ${data.checklist_fisica.movimento?'checked':''}> Me movimentei</label></div></div>
            <div class="section"><h3>Checklist Autocuidado</h3><div class="checklist-vertical"><label><input type="checkbox" id="auto_med" ${data.checklist_autocuidado.medicamentos?'checked':''}> Tomei medicamentos</label><label><input type="checkbox" id="auto_ter" ${data.checklist_autocuidado.terapia?'checked':''}> Fui à terapia</label><label><input type="checkbox" id="auto_amor" ${data.checklist_autocuidado.amorProprio?'checked':''}> Pratiquei amor-próprio</label><label><input type="checkbox" id="auto_lim" ${data.checklist_autocuidado.limites?'checked':''}> Estabeleci limites</label><label><input type="checkbox" id="auto_aju" ${data.checklist_autocuidado.ajuda?'checked':''}> Pedi ajuda</label><label><input type="checkbox" id="auto_detox" ${data.checklist_autocuidado.detox?'checked':''}> Detox de tela</label><label><input type="checkbox" id="auto_skincare" ${data.checklist_autocuidado.skincare?'checked':''}> Skincare</label><label><input type="checkbox" id="auto_cama" ${data.checklist_autocuidado.arrumarCama?'checked':''}> Arrumar a cama</label><label><input type="checkbox" id="auto_hobby" ${data.checklist_autocuidado.hobby?'checked':''}> Hobby</label></div></div></div>
            <div class="two-columns"><div class="section"><h3>Elogie-se, você é uma estrela</h3><textarea id="elogio1" placeholder="Elogio 1">${data.elogios[0]}</textarea><textarea id="elogio2" placeholder="Elogio 2">${data.elogios[1]}</textarea><textarea id="elogio3" placeholder="Elogio 3">${data.elogios[2]}</textarea></div>
            <div class="section"><h3>Gratidão pelo episódio de hoje</h3><textarea id="gratidao1" placeholder="Gratidão 1">${data.gratidao[0]}</textarea><textarea id="gratidao2" placeholder="Gratidão 2">${data.gratidao[1]}</textarea><textarea id="gratidao3" placeholder="Gratidão 3">${data.gratidao[2]}</textarea></div></div>
            <div class="section"><h3>Sofá da Preguiça</h3><textarea id="sofaPreguica" placeholder="O que procrastinei hoje?">${data.sofa_preguica||""}</textarea></div>
            <div class="section"><h3>HD Sigiloso</h3><textarea id="hdSigiloso" placeholder="Uma carta para nunca ser enviada">${data.hd_sigiloso||""}</textarea></div>
        `;
        document.getElementById('exercicioBtn')?.addEventListener('click', () => {
            const exs = ["Escreva sobre um momento que você se sentiu orgulhosa", "Descreva uma situação de ansiedade e como lidou", "Escreva uma carta de perdão para si mesma"];
            alert(exs[Math.floor(Math.random() * exs.length)]);
        });
        document.getElementById('tvSmartBtn')?.addEventListener('click', () => openDiarioModal());
        document.querySelectorAll('.estrela-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.estrela-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
            };
        });
        document.querySelectorAll('#page0 input, #page0 textarea').forEach(el => {
            if(el.id && el.tagName === 'INPUT' && el.type === 'checkbox') {
                el.addEventListener('change', () => capturePage0());
            } else if(el.id && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox'))) {
                el.addEventListener('input', () => capturePage0());
            }
        });
    }
    
    function capturePage0() {
        if(!users[currentUser]?.diarios?.[currentDate]) return;
        let data = users[currentUser].diarios[currentDate];
        data.reflexao = document.getElementById('reflexaoTexto')?.value || "";
        data.estrela_roteiro = document.getElementById('estrelaRoteiro')?.value || "";
        let sel = document.querySelector('.estrela-option.selected');
        if(sel) data.estrela = sel.dataset.estrela;
        data.elogios = [document.getElementById('elogio1')?.value||"", document.getElementById('elogio2')?.value||"", document.getElementById('elogio3')?.value||""];

    }
    
    function loadDate() {
        if(!users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate] = getEmptyDiary();
        renderPagina0();
        renderPagina1();
        renderPagina2();
        renderPagina3();
        renderPagina4();
        renderPagina5();
        if(currentPage===6) renderRodaVida();
        if(currentPage===7) renderIkigai();
        if(currentPage===8) renderArquivos();
        updateHistorySelect();
    }
    
    function updateHistorySelect() {
        let select = document.getElementById('historySelect');
        if(!select) return;
        let dates = Object.keys(users[currentUser].diarios || {}).sort().reverse();
        select.innerHTML = '<option value="hoje">Hoje</option>';
        dates.forEach(d => { if(d !== new Date().toISOString().slice(0,10)) select.innerHTML += `<option value="${d}">${d}</option>`; });
        select.value = currentDate === new Date().toISOString().slice(0,10) ? "hoje" : currentDate;
    }
    
    function initDashboard() {
        let today = new Date().toISOString().slice(0,10);
        if(!users[currentUser].diarios) users[currentUser].diarios = {};
        if(!users[currentUser].diarios[today]) users[currentUser].diarios[today] = getEmptyDiary();
        currentDate = today;
        loadDate();
        document.getElementById('currentUserDisplay').innerText = currentUser;
        document.getElementById('avatarBtn').innerText = currentUser.charAt(0).toUpperCase();
        document.getElementById('saveEntryBtn').onclick = () => { capturePage0(); alert("Episódio salvo!"); };
        document.getElementById('historySelect').onchange = (e) => { let val = e.target.value === "hoje" ? new Date().toISOString().slice(0,10) : e.target.value; capturePage0(); currentDate = val; loadDate(); };
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; document.getElementById('dashboard').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; };
        let nav = document.getElementById('pageNav');
        nav.innerHTML = pageNames.map((n,i) => `<button class="page-btn ${i===0?'active':''}" data-page="${i}">${n}</button>`).join('');
        document.querySelectorAll('.page-btn').forEach(btn => { btn.onclick = () => { capturePage0(); changePage(parseInt(btn.dataset.page)); }; });
        changePage(0);
    }
    
    // LOGIN
    let isLoginMode = true;
    document.getElementById('submitBtn').onclick = () => {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        if(!user || !pass) { document.getElementById('loginError').innerText = "Preencha usuário e senha."; return; }
        if(isLoginMode) {
            if(users[user] && users[user].senha === pass) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            } else { document.getElementById('loginError').innerText = "Usuário ou senha incorretos."; }
        } else {
            if(users[user]) { document.getElementById('loginError').innerText = "Usuário já existe."; }
            else {
                users[user] = { senha: pass, diarios: {} };
                localStorage.setItem('netpsi_users', JSON.stringify(users));
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            }
        }
    };
    document.getElementById('switchBtn').onclick = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('formTitle').innerText = isLoginMode ? "Entrar na sua temporada" : "Criar sua temporada";
        document.getElementById('submitBtn').innerText = isLoginMode ? "Entrar" : "Criar conta";
        document.getElementById('switchBtn').innerText = isLoginMode ? "Criar sua temporada" : "Já tenho conta";
        document.getElementById('loginError').innerText = "";
    };
</script>
</body>
</html>
