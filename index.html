<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NETPSI - Seu Diário Terapêutico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #141414; color: #e5e5e5; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 18px; line-height: 1.5; }
        
        .login-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; }
        .netpsi-logo { font-size: 3.5rem; font-weight: 900; color: #E50914; text-shadow: 0 0 15px rgba(229,9,20,0.5); text-align: center; }
        .tagline { font-size: 1.1rem; color: #ccc; text-align: center; margin: 0.5rem 0; }
        .producer { font-size: 0.8rem; color: #888; text-align: center; margin-bottom: 2rem; }
        .login-card { background: rgba(0,0,0,0.8); border-radius: 16px; padding: 1.8rem; width: 100%; max-width: 420px; backdrop-filter: blur(10px); }
        .login-card h2 { margin-bottom: 1rem; font-size: 1.6rem; color: white; }
        .input-group { margin-bottom: 1rem; }
        .input-group input { width: 100%; padding: 1rem; background: #333; border: none; border-radius: 10px; color: white; font-size: 1rem; }
        .btn-red { background: #E50914; color: white; border: none; padding: 0.9rem; font-size: 1.1rem; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 0.8rem; transition: all 0.2s; }
        .btn-red:hover { background: #f6121d; transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid #E50914; color: #E50914; padding: 0.5rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.9rem; }
        .switch-btn { background: none; border: none; color: #b3b3b3; margin-top: 1rem; cursor: pointer; width: 100%; font-size: 0.9rem; }
        .login-footer { text-align: center; margin-top: 2rem; font-size: 0.8rem; color: #b3b3b3; font-style: italic; }
        
        .dashboard { display: none; padding-bottom: 2rem; }
        .nav-bar { background: linear-gradient(to bottom, #000000cc, #141414); padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; position: sticky; top: 0; z-index: 100; }
        .nav-logo { font-size: 1.8rem; font-weight: bold; color: #E50914; letter-spacing: -1px; }
        .page-nav { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .page-btn { background: transparent; border: none; color: #aaa; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.8rem; border-radius: 30px; transition: all 0.2s; }
        .page-btn.active { background: #E50914; color: white; }
        .user-info { display: flex; align-items: center; gap: 0.8rem; position: relative; }
        .avatar { width: 48px; height: 48px; background: #000; border: 2px solid #E50914; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #E50914; border-radius: 8px; cursor: pointer; object-fit: cover; overflow: hidden; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-menu { display: none; position: absolute; top: 55px; right: 0; background: #1f1f1f; border-radius: 12px; padding: 0.5rem; z-index: 200; flex-direction: column; gap: 0.5rem; border: 1px solid #E50914; }
        .avatar-menu button { background: #333; border: none; color: white; padding: 0.3rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-logout { background: #E50914; color: white; border: none; padding: 0.4rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.9rem; }
        .save-bar { background: #1f1f1f; padding: 0.8rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; border-bottom: 1px solid #333; }
        .btn-save { background: #E50914; color: white; border: none; padding: 0.5rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.9rem; }
        .history-select { background: #333; color: white; padding: 0.4rem 0.8rem; border-radius: 30px; border: none; font-size: 0.9rem; }
        .page-container { max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
        .section { background: #1f1f1f; border-radius: 16px; padding: 1.2rem; margin-bottom: 1.2rem; border-left: 6px solid #E50914; }
        .section h3 { color: #E50914; margin-bottom: 0.8rem; font-size: 1.4rem; font-weight: 600; }
        .section h4 { color: #E50914; margin-bottom: 0.5rem; font-size: 1.2rem; }
        .hidden { display: none; }
        .two-columns { display: grid; grid-template-columns: 1fr; gap: 1.2rem; margin-bottom: 1rem; }
        @media (min-width: 768px) { .two-columns { grid-template-columns: 1fr 1fr; } }
        
        input, textarea { background: #2a2a2a; border: none; padding: 0.7rem; color: white; border-radius: 12px; width: 100%; font-size: 1rem; font-family: inherit; margin-bottom: 0.8rem; }
        textarea { resize: vertical; min-height: 80px; border: 1px solid #E50914; }
        
        .checklist-vertical { display: flex; flex-direction: column; gap: 0.5rem; }
        .checklist-vertical label { display: flex; align-items: center; gap: 0.8rem; font-size: 1rem; cursor: pointer; }
        .checklist-vertical input { width: 22px; height: 22px; margin-bottom: 0; accent-color: #E50914; }
        
        .estrela-options { display: flex; gap: 1rem; margin: 0.8rem 0; flex-wrap: wrap; }
        .estrela-option { background: #2a2a2a; padding: 0.5rem 1.2rem; border-radius: 40px; cursor: pointer; font-size: 1rem; }
        .estrela-option.selected { background: #E50914; color: white; }
        
        .tv-smart { background: #2a2a2a; border-radius: 24px; padding: 1rem; text-align: center; cursor: pointer; border: 2px solid #E50914; margin-bottom: 0.8rem; }
        .tv-screen { background: #0a0a0a; border-radius: 16px; padding: 1rem; margin-bottom: 0.5rem; font-size: 1.2rem; font-weight: bold; }
        
        /* Oscar dourado com borda neon */
        .streak-card { background: #2a2a2a; border-radius: 20px; padding: 0.8rem; text-align: center; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; border: 2px solid #FFD700; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
        .oscar-icon { font-size: 2rem; filter: drop-shadow(0 0 5px #FFD700); color: #FFD700; text-shadow: 0 0 10px #FFD700; }
        .streak-number { font-size: 2rem; font-weight: bold; color: #E50914; }
        
        .info-card { background: #2a2a2a; padding: 1rem; border-radius: 16px; margin-bottom: 1rem; }
        .sugestoes-chips { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.8rem 0; }
        .chip { background: #3a3a3a; padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .chip:hover { background: #E50914; color: white; }
        
        .modal-full { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; z-index: 1000; justify-content: center; align-items: center; flex-direction: column; padding: 2rem; }
        .modal-full .modal-content { width: 95%; max-width: 700px; background: #1f1f1f; border-radius: 24px; padding: 1.5rem; border-left: 6px solid #E50914; }
        .close-modal { cursor: pointer; font-size: 2rem; float: right; color: #E50914; }
        
        /* NeuroFlix */
        .hormonios-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
        @media (max-width: 900px) { .hormonios-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .hormonios-grid { grid-template-columns: 1fr; } }
        .hormonio-card { background: #2a2a2a; padding: 1rem; border-radius: 16px; height: 100%; display: flex; flex-direction: column; }
        .hormonio-card h4 { font-size: 1.2rem; margin-bottom: 0.3rem; }
        .hormonio-card p { font-size: 0.8rem; color: #ccc; margin-bottom: 0.8rem; }
        .check-group-vertical { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
        .check-group-vertical label { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; cursor: pointer; }
        .check-group-vertical input { width: 18px; height: 18px; margin: 0; }
        
        .card-dopamina { border-left: 6px solid #FFD700; }
        .card-ocitocina { border-left: 6px solid #FF69B4; }
        .card-endorfina { border-left: 6px solid #00CED1; }
        .card-serotonina { border-left: 6px solid #32CD32; }
        
        /* Esferas da Amizade */
        .esferas-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media (min-width: 768px) { .esferas-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } }
        .esfera-card { background: #1f1f1f; border-radius: 16px; padding: 1rem; border-left: 6px solid #E50914; }
        .esfera-card h4 { color: #E50914; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .esfera-desc { font-size: 0.8rem; color: #aaa; margin-bottom: 0.8rem; cursor: pointer; }
        .desc-full { display: none; font-size: 0.75rem; color: #ccc; margin-bottom: 0.8rem; padding: 0.5rem; background: #2a2a2a; border-radius: 8px; }
        .desc-full.open { display: block; }
        
        /* Arquivo X */
        .vhs-container { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media (min-width: 500px) { .vhs-container { grid-template-columns: 1fr 1fr; } }
        .vhs-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-radius: 16px; padding: 1rem; border: 1px solid #E50914; }
        .vhs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .vhs-date { font-size: 0.9rem; font-weight: bold; color: #E50914; cursor: pointer; }
        .vhs-actions { display: flex; gap: 0.5rem; }
        .edit-vhs, .delete-vhs { background: #E50914; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 0.7rem; }
        .vhs-content { display: none; margin-top: 0.5rem; }
        .vhs-content.open { display: block; }
        .vhs-content textarea { width: 100%; background: #1a1a1a; border: 1px solid #E50914; color: white; padding: 0.5rem; border-radius: 8px; font-size: 0.8rem; margin-bottom: 0.5rem; }
        .save-vhs { background: #E50914; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 0.7rem; }
        
        .text-small { font-size: 0.85rem; color: #aaa; }
        
        .emo-acordeon { margin-bottom: 0.5rem; }
        .emo-header { background: #2a2a2a; padding: 0.7rem; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; }
        .emo-header h4 { color: #4CAF50; font-size: 1rem; }
        .emo-content { display: none; padding: 0.8rem; background: #252525; border-radius: 10px; margin-top: 0.3rem; }
        .emo-content.open { display: block; }
        .emo-question { margin-bottom: 0.8rem; }
        .emo-question label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 0.2rem; }
        input[type="range"] { width: 100%; margin: 0.5rem 0; }
        
        .blocked-message { text-align: center; padding: 2rem; background: #1f1f1f; border-radius: 16px; color: #E50914; }
        
        /* Ikigai */
        .ikigai-central { text-align: center; margin: 1rem 0; }
        .ikigai-symbol { display: inline-block; background: #E50914; border-radius: 50%; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px rgba(229,9,20,0.5); }
        .ikigai-symbol span { color: white; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        .ikigai-desc { background: #2a2a2a; padding: 1rem; border-radius: 16px; margin: 1rem 0; font-size: 0.9rem; line-height: 1.5; }
        .ikigai-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1.5rem 0; }
        @media (max-width: 600px) { .ikigai-grid { grid-template-columns: 1fr; } }
        .ikigai-card { background: #1f1f1f; border: 2px solid #E50914; border-radius: 20px; padding: 1rem; }
        .ikigai-card h4 { color: #E50914; font-size: 1rem; margin-bottom: 0.5rem; }
        .ikigai-card textarea { background: #2a2a2a; border: 1px solid #E50914; width: 100%; }
        
        .intersecao-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1.5rem 0; }
        @media (max-width: 600px) { .intersecao-grid { grid-template-columns: 1fr; } }
        .intersecao-card { background: #2a2a2a; padding: 1rem; border-radius: 16px; border-left: 4px solid #E50914; }
        .intersecao-card .resposta-gerada { font-size: 0.8rem; color: #ccc; margin-top: 0.5rem; padding: 0.5rem; background: #1f1f1f; border-radius: 8px; }
        
        /* Diagnostflix */
        .roda-single { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; margin-bottom: 0.8rem; }
        .nota-botao { background: #333; border: 1px solid #E50914; color: #E50914; padding: 0.2rem 0.6rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; margin-right: 0.5rem; }
        .checkbox-circle { appearance: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #E50914; outline: none; margin-right: 0.5rem; cursor: pointer; background: transparent; }
        .checkbox-circle:checked { background: #E50914; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">Dados sigilosos,<br>aqui ninguém assiste sua série,<br>suas emoções são apenas suas.</div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-logo">NETPSI</div>
        <div class="page-nav" id="pageNav"></div>
        <div class="user-info">
            <div class="avatar" id="avatarBtn">N</div>
            <div id="avatarMenu" class="avatar-menu">
                <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
                <button id="uploadAvatarBtn">Trocar Foto</button>
                <button id="removeAvatarBtn">Remover Foto</button>
            </div>
            <span id="currentUserDisplay"></span>
            <button class="btn-logout" id="logoutBtn">Sair</button>
        </div>
    </div>
    <div class="save-bar">
        <button class="btn-save" id="saveEntryBtn">Salvar episódio de hoje</button>
        <select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select>
    </div>
    <div id="page0" class="page-container"></div>
    <div id="page1" class="page-container hidden"></div>
    <div id="page2" class="page-container hidden"></div>
    <div id="page3" class="page-container hidden"></div>
    <div id="page4" class="page-container hidden"></div>
    <div id="page5" class="page-container hidden"></div>
    <div id="page6" class="page-container hidden"></div>
    <div id="page7" class="page-container hidden"></div>
    <div id="page8" class="page-container hidden"></div>
    <div id="page9" class="page-container hidden"></div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
    let currentUser = null;
    let currentDate = new Date().toISOString().slice(0,10);
    let currentPage = 0;
    
    const pageNames = ["EPISÓDIO", "CINEMOÇÕES", "AÇÃO", "CRISEPLAY", "REPLAY", "NEUROFLIX", "COADJUVANTES", "DIAGNOSTIFLIX", "IKIGAI", "ARQUIVO X"];
    const pageKeys = ['page0','page1','page2','page3','page4','page5','page6','page7','page8','page9'];
    
    const emocoesList = ["Alegria","Tédio","Medo","Raiva","Tristeza","Nojo","Frustração","Apatia","Vergonha","Ressentimento","Inveja","Carência","Esperança","Alívio","Amor","Paixão","Impulso","Orgulho","Solidão","Paciência"];
    
    function calcularStreak() {
        if(!currentUser || !users[currentUser].diarios) return 0;
        let dates = Object.keys(users[currentUser].diarios).sort();
        let streak = 0;
        for(let i=dates.length-1; i>=0; i--) {
            let diff = (new Date() - new Date(dates[i])) / (1000*60*60*24);
            if(diff <= 1 && users[currentUser].diarios[dates[i]].salvo) streak++;
            else break;
        }
        return streak;
    }
    
    function getEmptyDiary() {
        let emocoes = {};
        emocoesList.forEach(e => { emocoes[e] = { intensidade: 0, gatilho: "", pensamentos: "", outra_forma: "", descricao: "" }; });
        return {
            salvo: false, estrela: "", estrela_roteiro: "", diario_texto: "", reflexao: "",
            checklist_fisica: { banho:false, dentes:false, agua:false, comida:false, sol:false, movimento:false, alongamento:false, respiracao:false, tempoPausa:false, refeicaoLenta:false },
            checklist_autocuidado: { medicamentos:false, terapia:false, amorProprio:false, limites:false, ajuda:false, detox:false, skincare:false, arrumarCama:false, hobby:false, atividadeBem:false },
            replay: { situacao: "", aceito: "", agradeco: "", nao_faz_bem: "", faz_bem: "", deixo_ir: "", desfruto: "", nao_preciso: "" },
            criseplay: { fisica: {}, sensorial: {}, emocional: {} },
            plano_acao: {},
            ikigai: { respostas: { ama: "", boa: "", mundo: "", paga: "", paixao: "", missao: "", vocacao: "", profissao: "" }, gerado: false },
            ikigai_data: null,
            roda_vida: {}, coadjuvantes: {}, 
            saga: { dop1:false,dop2:false,dop3:false, oci1:false,oci2:false,oci3:false, end1:false,end2:false,end3:false, ser1:false,ser2:false,ser3:false }
        };
    }
    
    function saveAll() { if(currentUser) localStorage.setItem('netpsi_users', JSON.stringify(users)); }
    
    function changePage(page) {
        currentPage = page;
        for(let i=0;i<pageKeys.length;i++) document.getElementById(pageKeys[i]).classList.add('hidden');
        document.getElementById(pageKeys[page]).classList.remove('hidden');
        let btns = document.querySelectorAll('.page-btn');
        for(let i=0;i<btns.length;i++) { if(i==page) btns[i].classList.add('active'); else btns[i].classList.remove('active'); }
        if(page===0) renderPagina0();
        if(page===1) renderPagina1();
        if(page===2) renderPagina2();
        if(page===3) renderPagina3();
        if(page===4) renderPagina4();
        if(page===5) renderPagina5();
        if(page===6) renderPagina6();
        if(page===7) renderPagina7();
        if(page===8) renderIkigai();
        if(page===9) renderArquivos();
    }
    
    function openFullDiarioModal() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let modal = document.createElement('div'); modal.className='modal-full';
        modal.innerHTML = `<div class="modal-content"><div><span class="close-modal">&times;</span><h3>Como foi o episódio de hoje?</h3></div><textarea id="modalDiarioText" rows="8" placeholder="Escreva como foi seu dia...">${data.diario_texto||""}</textarea><label>Adicionar foto</label><input type="file" id="modalPhoto" accept="image/*"><button class="btn-red" id="saveModalBtn">Salvar</button></div>`;
        document.body.appendChild(modal); modal.style.display='flex';
        modal.querySelector('.close-modal').onclick = () => modal.remove();
        document.getElementById('saveModalBtn').onclick = () => {
            let texto = document.getElementById('modalDiarioText').value;
            let file = document.getElementById('modalPhoto').files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = e => {
                    if(users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate].diario_texto = texto;
                    users[currentUser].diarios[currentDate].diario_foto = e.target.result;
                    saveAll(); modal.remove();
                };
                reader.readAsDataURL(file);
            } else {
                if(users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate].diario_texto = texto;
                saveAll(); modal.remove();
            }
        };
    }
    
    // PÁGINA 0 - EPISÓDIO
    function renderPagina0() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let streak = calcularStreak();
        document.getElementById('page0').innerHTML = `
            <div class="streak-card"><div class="oscar-icon">🏆</div><div class="streak-number">${streak}</div><div>Oscar da Constância</div></div>
            <div class="section"><h3>EXERCÍCIO TERAPÊUTICO</h3><div class="tv-smart" id="exercicioBtn"><div class="tv-screen">CLIQUE AQUI<br>PARA SEU EXERCÍCIO DO DIA</div></div><textarea id="reflexaoTexto" rows="3" placeholder="Escreva sua reflexão...">${data.reflexao||""}</textarea></div>
            <div class="section"><div class="tv-smart" id="tvSmartBtn"><div class="tv-screen">COMO FOI O EPISÓDIO DE HOJE?</div></div></div>
            <div class="section"><h3>Como está sua estrela hoje?</h3><div class="estrela-options"><div class="estrela-option ${data.estrela==='brilhando'?'selected':''}" data-estrela="brilhando">Brilhando</div><div class="estrela-option ${data.estrela==='apagada'?'selected':''}" data-estrela="apagada">Apagada</div></div><textarea id="estrelaRoteiro" placeholder="Descreva o roteiro...">${data.estrela_roteiro}</textarea></div>

    function renderPagina7() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let roda = data.roda_vida || {};
        let pode = (!data.roda_vida_data || new Date(data.roda_vida_data).getMonth() !== new Date().getMonth());
        if(!pode) { document.getElementById('page7').innerHTML = `<div class="blocked-message">Você já avaliou sua vida este mês. Volte no mês que vem.</div>`; return; }
        let html = `<div class="section"><h3>Avalie sua vida</h3><p class="text-small">Esta avaliação pode ser feita uma vez por mês.</p>`;
        for(let i=0;i<areasDiagnosti.length;i++) {
            let nota = roda[i] || 0;
            html += `<div class="roda-single"><h4>${areasDiagnosti[i]}</h4><button class="nota-botao" data-area="${i}" style="background:#333; border:1px solid #E50914; padding:0.3rem 0.8rem; border-radius:20px; cursor:pointer;">Selecionar nota</button><span style="margin-left:0.5rem; color:#E50914;" id="nota_display_${i}">${nota > 0 ? nota+"/10" : "Não selecionada"}</span><textarea id="comentario_${i}" placeholder="Comente sobre essa área..." rows="2">${roda[`comentario_${i}`]||""}</textarea></div>`;
        }
        html += `<button class="btn-red" id="salvarRodaBtn">Salvar avaliação</button></div>`;
        document.getElementById('page7').innerHTML = html;
        for(let i=0;i<areasDiagnosti.length;i++) {
            let btn = document.querySelector(`.nota-botao[data-area="${i}"]`);
            if(btn) btn.onclick = () => { let nota = prompt("Digite sua nota de 1 a 10:", "5"); if(nota && nota>=1 && nota<=10) { document.getElementById(`nota_display_${i}`).innerText = nota + "/10"; if(users[currentUser].diarios[currentDate]) { if(!users[currentUser].diarios[currentDate].roda_vida) users[currentUser].diarios[currentDate].roda_vida = {}; users[currentUser].diarios[currentDate].roda_vida[i] = parseInt(nota); saveAll(); } } };
            let comentario = document.getElementById(`comentario_${i}`);
            if(comentario) comentario.addEventListener('input', () => { if(users[currentUser].diarios[currentDate]) { if(!users[currentUser].diarios[currentDate].roda_vida) users[currentUser].diarios[currentDate].roda_vida = {}; users[currentUser].diarios[currentDate].roda_vida[`comentario_${i}`] = comentario.value; saveAll(); } });
        }
        document.getElementById('salvarRodaBtn')?.addEventListener('click', () => { 
            if(users[currentUser].diarios[currentDate]) { users[currentUser].diarios[currentDate].roda_vida_data = new Date().toISOString(); saveAll(); alert("Avaliação salva! Volte mês que vem."); renderPagina7(); } 
        });
    }
    
    // PÁGINA 8 - IKIGAI
    function renderIkigai() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let pode = (!data.ikigai_data || (new Date() - new Date(data.ikigai_data) > 60*24*60*60*1000));
        if(!pode) { document.getElementById('page8').innerHTML = `<div class="blocked-message">Você já fez seu IKIGAI neste bimestre. Volte daqui a 2 meses.</div>`; return; }
        let ikigai = data.ikigai || { respostas: { ama: "", boa: "", mundo: "", paga: "" }, gerado: false };
        document.getElementById('page8').innerHTML = `<div class="section"><h3>Ikigai - Razão de ser</h3>
            <div class="ikigai-central"><div class="ikigai-symbol"><span>IKIGAI</span></div></div>
            <div class="ikigai-desc"><p>Ikigai é um conceito japonês que significa "razão de ser". Ele representa o ponto de equilíbrio entre o que você ama, no que você é bom, o que o mundo precisa e pelo que pode ser pago.</p></div>
            <div class="ikigai-grid">
                <div class="ikigai-card"><h4>Aquilo que você ama</h4><textarea id="ikigai_ama" rows="2" placeholder="O que te faz sentir viva?">${ikigai.respostas.ama}</textarea></div>
                <div class="ikigai-card"><h4>Aquilo que você é bom</h4><textarea id="ikigai_boa" rows="2" placeholder="Quais seus talentos?">${ikigai.respostas.boa}</textarea></div>
                <div class="ikigai-card"><h4>Aquilo que o mundo precisa</h4><textarea id="ikigai_mundo" rows="2" placeholder="Como quer ajudar o mundo?">${ikigai.respostas.mundo}</textarea></div>
                <div class="ikigai-card"><h4>Aquilo pelo que pode ser pago</h4><textarea id="ikigai_paga" rows="2" placeholder="O que pode virar profissão?">${ikigai.respostas.paga}</textarea></div>
            </div>
            <button class="btn-red" id="gerarIkigaiBtn">DESCUBRA SEU IKIGAI</button>
            <div id="resultadoIkigai" class="info-card" style="margin-top:1rem;"><h4>Resultado:</h4><p>Preencha os 4 campos e clique no botão para descobrir seu propósito.</p></div>
            <button class="btn-outline" id="salvarIkigaiBtn" style="margin-top:1rem;">Salvar IKIGAI</button>`;
        
        document.getElementById('gerarIkigaiBtn')?.addEventListener('click', () => {
            let ama = document.getElementById('ikigai_ama').value;
            let boa = document.getElementById('ikigai_boa').value;
            let mundo = document.getElementById('ikigai_mundo').value;
            let paga = document.getElementById('ikigai_paga').value;
            document.getElementById('resultadoIkigai').innerHTML = `<h4>Resultado:</h4><p>Seu IKIGAI: ${ama.substring(0,50)} + ${boa.substring(0,50)} + ${mundo.substring(0,50)} + ${paga.substring(0,50)}. Continue aprofundando seu propósito.</p>`;
            if(users[currentUser].diarios[currentDate]) { if(!users[currentUser].diarios[currentDate].ikigai) users[currentUser].diarios[currentDate].ikigai = { respostas: {}, gerado: false }; users[currentUser].diarios[currentDate].ikigai.respostas = { ama, boa, mundo, paga }; users[currentUser].diarios[currentDate].ikigai.gerado = true; saveAll(); }
        });
        document.getElementById('salvarIkigaiBtn')?.addEventListener('click', () => { if(users[currentUser].diarios[currentDate]) { users[currentUser].diarios[currentDate].ikigai_data = new Date().toISOString(); saveAll(); alert("IKIGAI salvo! Próxima jornada em 2 meses."); renderIkigai(); } });
    }
    
    // PÁGINA 9 - ARQUIVO X
    function renderArquivos() {
        let diarios = users[currentUser]?.diarios || {};
        let dates = Object.keys(diarios).sort().reverse();
        let html = `<div class="vhs-container">`;
        dates.forEach(d => {
            let entry = diarios[d];
            let texto = entry?.diario_texto || "";
            html += `<div class="vhs-card" data-data="${d}"><div class="vhs-header"><div class="vhs-date">🎞️ ${d}</div><div class="vhs-actions"><button class="edit-vhs" data-data="${d}">Editar</button><button class="delete-vhs" data-data="${d}">Excluir</button></div></div><div class="vhs-content" id="vhs-content-${d.replace(/-/g,'')}"><textarea id="edit-text-${d.replace(/-/g,'')}" rows="3">${texto}</textarea><button class="save-vhs" data-data="${d}">Salvar</button></div></div>`;
        });
        html += `</div>`;
        document.getElementById('page9').innerHTML = html;
        
        document.querySelectorAll('.edit-vhs').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); let data = btn.dataset.data; let contentDiv = document.getElementById(`vhs-content-${data.replace(/-/g,'')}`); if(contentDiv) contentDiv.classList.toggle('open'); }; });
        document.querySelectorAll('.save-vhs').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); let data = btn.dataset.data; let textarea = document.getElementById(`edit-text-${data.replace(/-/g,'')}`); if(textarea && users[currentUser].diarios[data]) { users[currentUser].diarios[data].diario_texto = textarea.value; saveAll(); alert("Salvo!"); } }; });
        document.querySelectorAll('.delete-vhs').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); let data = btn.dataset.data; if(confirm("Excluir este dia permanentemente?")) { delete users[currentUser].diarios[data]; saveAll(); renderArquivos(); } }; });
    }
    
    function loadAll() {
        if(!users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate] = getEmptyDiary();
        let select = document.getElementById('historySelect');
        if(select) {
            let dates = Object.keys(users[currentUser].diarios).sort().reverse();
            select.innerHTML = '<option value="hoje">Hoje</option>';
            dates.forEach(d => { if(d !== new Date().toISOString().slice(0,10)) select.innerHTML += `<option value="${d}">${d}</option>`; });
            select.value = currentDate === new Date().toISOString().slice(0,10) ? "hoje" : currentDate;
        }
    }
    
    function initDashboard() {
        let today = new Date().toISOString().slice(0,10);
        if(!users[currentUser].diarios) users[currentUser].diarios = {};
        if(!users[currentUser].diarios[today]) users[currentUser].diarios[today] = getEmptyDiary();
        currentDate = today;
        loadAll();
        document.getElementById('currentUserDisplay').innerText = currentUser;
        let avatar = document.getElementById('avatarBtn');
        if(users[currentUser].fotoPerfil) avatar.innerHTML = `<img src="${users[currentUser].fotoPerfil}" class="avatar-img">`;
        else avatar.innerText = currentUser.charAt(0).toUpperCase();
        document.getElementById('saveEntryBtn').onclick = () => { if(users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate].salvo = true; saveAll(); alert("Episódio salvo!"); renderPagina0(); };
        document.getElementById('historySelect').onchange = (e) => { let val = e.target.value === "hoje" ? new Date().toISOString().slice(0,10) : e.target.value; currentDate = val; loadAll(); };
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; document.getElementById('dashboard').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; };
        let nav = document.getElementById('pageNav');
        nav.innerHTML = pageNames.map((n,i) => `<button class="page-btn" data-page="${i}">${n}</button>`).join('');
        document.querySelectorAll('.page-btn').forEach(btn => { btn.onclick = () => changePage(parseInt(btn.dataset.page)); });
        let avatarBtn = document.getElementById('avatarBtn');
        let menu = document.getElementById('avatarMenu');
        avatarBtn.onclick = (e) => { e.stopPropagation(); menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex'; };
        document.addEventListener('click', () => menu.style.display = 'none');
        document.getElementById('uploadAvatarBtn').onclick = () => document.getElementById('avatarUpload').click();
        document.getElementById('avatarUpload').onchange = (e) => { let file = e.target.files[0]; if(file) { let reader = new FileReader(); reader.onload = ev => { users[currentUser].fotoPerfil = ev.target.result; saveAll(); avatar.innerHTML = `<img src="${ev.target.result}" class="avatar-img">`; }; reader.readAsDataURL(file); } };
        document.getElementById('removeAvatarBtn').onclick = () => { delete users[currentUser].fotoPerfil; saveAll(); avatar.innerText = currentUser.charAt(0).toUpperCase(); };
        changePage(0);
    }
    
    // LOGIN - CORRIGIDO
    let isLoginMode = true;
    function handleLogin() {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        if(!user || !pass) { document.getElementById('loginError').innerText = "Preencha usuário e senha."; return; }
        if(isLoginMode) {
            if(users[user] && users[user].senha === pass) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            } else { document.getElementById('loginError').innerText = "Usuário ou senha incorretos."; }
        } else {
            if(users[user]) { document.getElementById('loginError').innerText = "Usuário já existe."; }
            else {
                users[user] = { senha: pass, diarios: {} };
                localStorage.setItem('netpsi_users', JSON.stringify(users));
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            }
        }
    }
    document.getElementById('submitBtn').onclick = handleLogin;
    document.getElementById('loginPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('loginUser').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('switchBtn').onclick = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('formTitle').innerText = isLoginMode ? "Entrar na sua temporada" : "Criar sua temporada";
        document.getElementById('submitBtn').innerText = isLoginMode ? "Entrar" : "Criar conta";
        document.getElementById('switchBtn').innerText = isLoginMode ? "Criar sua temporada" : "Já tenho conta";
        document.getElementById('loginError').innerText = "";
    };
</script>
</body>
</html>
