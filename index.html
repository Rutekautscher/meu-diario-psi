<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NETPSI - Seu Diário Terapêutico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #141414; color: #e5e5e5; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .login-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; }
        .netpsi-logo { font-size: 4rem; font-weight: 900; color: #E50914; text-shadow: 0 0 15px rgba(229,9,20,0.5); text-align: center; }
        .tagline { font-size: 1rem; color: #ccc; text-align: center; margin: 0.5rem 0; }
        .producer { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 2rem; }
        .login-card { background: rgba(0,0,0,0.8); border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .login-card h2 { margin-bottom: 1rem; font-size: 1.5rem; color: white; }
        .input-group { margin-bottom: 1rem; }
        .input-group input { width: 100%; padding: 0.8rem; background: #333; border: none; border-radius: 8px; color: white; font-size: 1rem; }
        .btn-red { background: #E50914; color: white; border: none; padding: 0.8rem; font-size: 1rem; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 0.5rem; transition: all 0.2s; }
        .btn-red:hover { background: #f6121d; transform: scale(1.02); }
        .switch-btn { background: none; border: none; color: #b3b3b3; margin-top: 1rem; cursor: pointer; width: 100%; }
        .switch-btn:hover { color: #E50914; }
        .error-msg { color: #E50914; font-size: 0.75rem; margin-top: 0.5rem; text-align: center; }
        .login-footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #b3b3b3; font-style: italic; line-height: 1.5; }
        .dashboard { display: none; padding-bottom: 2rem; }
        .nav-bar { background: linear-gradient(to bottom, #000000cc, #141414); padding: 0.8rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 0.5rem; position: sticky; top: 0; z-index: 100; }
        .nav-logo { font-size: 1.5rem; font-weight: bold; color: #E50914; letter-spacing: -1px; }
        .page-nav { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .page-btn { background: transparent; border: none; color: #aaa; padding: 0.3rem 0.5rem; cursor: pointer; font-size: 0.7rem; border-radius: 20px; transition: all 0.2s; }
        .page-btn.active { background: #E50914; color: white; }
        .user-info { display: flex; align-items: center; gap: 0.8rem; }
        .avatar { width: 36px; height: 36px; background: #000; border: 2px solid #E50914; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; color: #E50914; border-radius: 4px; }
        .btn-logout { background: #E50914; border: none; color: white; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 0.75rem; }
        .save-bar { background: #1f1f1f; padding: 0.8rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; border-bottom: 1px solid #333; }
        .btn-save { background: #E50914; color: white; border: none; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .history-select { background: #333; color: white; padding: 0.3rem 0.6rem; border-radius: 20px; border: none; font-size: 0.7rem; }
        .page-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        .section { background: #1f1f1f; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #E50914; }
        .section h3 { color: #E50914; margin-bottom: 0.5rem; font-size: 1rem; }
        .hidden { display: none; }
        .two-columns { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem; }
        @media (min-width: 768px) { .two-columns { grid-template-columns: 1fr 1fr; } }
        input, textarea { background: #2a2a2a; border: none; padding: 0.5rem; color: white; border-radius: 8px; width: 100%; font-size: 0.85rem; margin-bottom: 0.5rem; }
        .checklist-vertical { display: flex; flex-direction: column; gap: 0.3rem; }
        .checklist-vertical label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; cursor: pointer; }
        .checklist-vertical input { width: auto; margin-bottom: 0; }
        .estrela-options { display: flex; gap: 1rem; margin: 0.5rem 0; flex-wrap: wrap; }
        .estrela-option { background: #2a2a2a; padding: 0.3rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.8rem; }
        .estrela-option.selected { background: #E50914; color: white; }
        .tv-smart { background: #2a2a2a; border-radius: 20px; padding: 1rem; text-align: center; cursor: pointer; border: 1px solid #E50914; margin-bottom: 0.5rem; }
        .tv-screen { background: #0a0a0a; border-radius: 10px; padding: 0.8rem; margin-bottom: 0.5rem; }
        .emo-acordeon { margin-bottom: 0.5rem; }
        .emo-header { background: #2a2a2a; padding: 0.5rem; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; }
        .emo-header h4 { color: #E50914; font-size: 0.85rem; }
        .emo-content { display: none; padding: 0.5rem; background: #252525; border-radius: 8px; margin-top: 0.3rem; }
        .emo-content.open { display: block; }
        .text-small { font-size: 0.7rem; color: #aaa; }
        .info-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; margin-bottom: 0.8rem; }
        .info-card h4 { color: #E50914; margin-bottom: 0.3rem; font-size: 0.85rem; }
        .vhs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
        .vhs-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-radius: 12px; padding: 0.8rem; cursor: pointer; border: 1px solid #E50914; text-align: center; position: relative; overflow: hidden; }
        .vhs-card::before { content: "SIDE A LOW QUALITY NOISE TAPE"; position: absolute; bottom: 4px; left: 6px; font-size: 0.5rem; color: #666; opacity: 0.6; white-space: nowrap; }
        .vhs-date { font-size: 0.85rem; font-weight: 600; color: #E50914; margin-bottom: 0.3rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: #1f1f1f; border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 1rem; border-left: 4px solid #E50914; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; color: #E50914; }
        .close-modal { cursor: pointer; font-size: 1.3rem; }
        .camera-box { background: #1f1f1f; border: 3px solid #E50914; border-radius: 16px; padding: 1rem; text-align: center; margin: 1rem 0; }
        .sugestoes-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
        .chip { background: #3a3a3a; padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.7rem; cursor: pointer; }
        .chip:hover { background: #E50914; color: white; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">Dados sigilosos,<br>aqui ninguém assiste sua série,<br>suas emoções são apenas suas.</div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-logo">NETPSI</div>
        <div class="page-nav" id="pageNav"></div>
        <div class="user-info"><div class="avatar" id="avatarBtn">N</div><span id="currentUserDisplay"></span><button class="btn-logout" id="logoutBtn">Sair</button></div>
    </div>
    <div class="save-bar"><button class="btn-save" id="saveEntryBtn">Salvar episódio</button><select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select></div>
    <div id="page0" class="page-container"></div>
    <div id="page1" class="page-container hidden"></div>
    <div id="page2" class="page-container hidden"></div>
    <div id="page3" class="page-container hidden"></div>
    <div id="page4" class="page-container hidden"></div>
    <div id="page5" class="page-container hidden"></div>
    <div id="page6" class="page-container hidden"></div>
    <div id="page7" class="page-container hidden"></div>
    <div id="page8" class="page-container hidden"></div>
</div>

<script>
    // DADOS
    let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
    let currentUser = null;
    let currentDate = new Date().toISOString().slice(0,10);
    let currentPage = 0;
    const pageNames = ["EPISÓDIO", "CINEMOÇÕES", "CRISEPLAY", "REPLAY", "NEUROFLIX", "COADJUVANTES", "DIAGNOSTIFLIX", "IKIGAI FLIX", "ARQUIVO X"];
    const pageKeys = ['page0','page1','page2','page3','page4','page5','page6','page7','page8'];
    
    const emocoesList = ["Alegria","Tédio","Medo","Raiva","Tristeza","Nojo","Frustração","Apatia","Vergonha","Ressentimento","Inveja","Carência","Esperança","Alívio","Amor","Paixão","Impulso","Orgulho","Solidão","Paciência"];
    
    function getEmptyDiary() {
        let emocoes = {};
        emocoesList.forEach(e => { emocoes[e] = { intensidade: 0, gatilho: "", pensamentos: "", outra_forma: "", descricao: "" }; });
        return {
            estrela: "", estrela_roteiro: "", diario_texto: "", reflexao: "",
            checklist_fisica: { banho:false, dentes:false, agua:false, comida:false, sol:false, movimento:false },
            checklist_autocuidado: { medicamentos:false, terapia:false, amorProprio:false, limites:false, ajuda:false, detox:false, skincare:false, arrumarCama:false, hobby:false },
            criseplay: {},
            replay: { situacao: "", aceito: "", agradeco: "", nao_faz_bem: "", faz_bem: "", deixo_ir: "", desfruto: "", nao_preciso: "" },
            elogios: ["","",""], gratidao: ["","",""], sofa_preguica: "", hd_sigiloso: "",
            emocoes: emocoes,
            ikigai_respostas: {}, ikigai_data: null,
            roda_vida: {}, roda_vida_data: null,
            coadjuvantes: {},
            saga: {}
        };
    }
    
    function saveAll() { if(currentUser) localStorage.setItem('netpsi_users', JSON.stringify(users)); }
    
    function changePage(page) {
        currentPage = page;
        for(let i=0;i<pageKeys.length;i++) document.getElementById(pageKeys[i]).classList.add('hidden');
        document.getElementById(pageKeys[page]).classList.remove('hidden');
        let btns = document.querySelectorAll('.page-btn');
        for(let i=0;i<btns.length;i++) { if(i==page) btns[i].classList.add('active'); else btns[i].classList.remove('active'); }
        if(page===0) renderPagina0();
        if(page===1) renderPagina1();
        if(page===2) renderPagina2();
        if(page===3) renderPagina3();
        if(page===4) renderPagina4();
        if(page===5) renderPagina5();
        if(page===6) renderDiagnostiFlix();
        if(page===7) renderIkigaiFlix();
        if(page===8) renderArquivos();
    }
    
    function renderPagina0() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        document.getElementById('page0').innerHTML = `
            <div class="section"><h3>EXERCÍCIO TERAPÊUTICO</h3><div class="tv-smart" id="exercicioBtn"><div class="tv-screen">CLIQUE AQUI<br>PARA SEU EXERCÍCIO</div></div><textarea id="reflexaoTexto" rows="3" placeholder="Escreva sua reflexão...">${data.reflexao||""}</textarea></div>
            <div class="section"><div class="tv-smart" id="tvSmartBtn"><div class="tv-screen">COMO FOI O EPISÓDIO DE HOJE?</div></div></div>
            <div class="section"><h3>Como está sua estrela hoje?</h3><div class="estrela-options"><div class="estrela-option" data-estrela="brilhando">Brilhando</div><div class="estrela-option" data-estrela="apagada">Apagada</div></div><textarea id="estrelaRoteiro" placeholder="Descreva o roteiro...">${data.estrela_roteiro}</textarea></div>
            <div class="two-columns"><div class="section"><h3>Checklist Saúde Física</h3><div class="checklist-vertical"><label><input type="checkbox" id="fis_banho"> Tomei banho</label><label><input type="checkbox" id="fis_dentes"> Escovei dentes</label><label><input type="checkbox" id="fis_agua"> Bebi água</label><label><input type="checkbox" id="fis_comida"> Comi bem</label><label><input type="checkbox" id="fis_sol"> Tomei sol</label><label><input type="checkbox" id="fis_movimento"> Me movimentei</label></div></div>
            <div class="section"><h3>Checklist Autocuidado</h3><div class="checklist-vertical"><label><input type="checkbox" id="auto_med"> Tomei medicamentos</label><label><input type="checkbox" id="auto_ter"> Fui à terapia</label><label><input type="checkbox" id="auto_amor"> Pratiquei amor-próprio</label><label><input type="checkbox" id="auto_lim"> Estabeleci limites</label><label><input type="checkbox" id="auto_aju"> Pedi ajuda</label><label><input type="checkbox" id="auto_detox"> Detox de tela</label><label><input type="checkbox" id="auto_skincare"> Skincare</label><label><input type="checkbox" id="auto_cama"> Arrumar a cama</label><label><input type="checkbox" id="auto_hobby"> Hobby</label></div></div></div>
            <div class="two-columns"><div class="section"><h3>Elogie-se, você é uma estrela</h3><textarea id="elogio1" placeholder="Elogio 1">${data.elogios[0]}</textarea><textarea id="elogio2" placeholder="Elogio 2">${data.elogios[1]}</textarea><textarea id="elogio3" placeholder="Elogio 3">${data.elogios[2]}</textarea></div>
            <div class="section"><h3>Gratidão pelo episódio de hoje</h3><textarea id="gratidao1" placeholder="Gratidão 1">${data.gratidao[0]}</textarea><textarea id="gratidao2" placeholder="Gratidão 2">${data.gratidao[1]}</textarea><textarea id="gratidao3" placeholder="Gratidão 3">${data.gratidao[2]}</textarea></div></div>
            <div class="section"><h3>Sofá da Preguiça</h3><textarea id="sofaPreguica" placeholder="O que procrastinei hoje?">${data.sofa_preguica||""}</textarea></div>
            <div class="section"><h3>HD Sigiloso</h3><textarea id="hdSigiloso" placeholder="Uma carta para nunca ser enviada">${data.hd_sigiloso||""}</textarea></div>
        `;
        document.getElementById('exercicioBtn')?.addEventListener('click', () => alert("Escreva sobre um momento que você se sentiu orgulhosa"));
        document.getElementById('tvSmartBtn')?.addEventListener('click', () => openDiarioModal());
        document.querySelectorAll('.estrela-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.estrela-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
            };
        });
        function capturePage0() {
            if(!users[currentUser]?.diarios?.[currentDate]) return;
            let d = users[currentUser].diarios[currentDate];
            d.reflexao = document.getElementById('reflexaoTexto')?.value || "";
            d.estrela_roteiro = document.getElementById('estrelaRoteiro')?.value || "";
            let sel = document.querySelector('.estrela-option.selected');
            if(sel) d.estrela = sel.dataset.estrela;
            d.elogios = [document.getElementById('elogio1')?.value||"", document.getElementById('elogio2')?.value||"", document.getElementById('elogio3')?.value||""];
            d.gratidao = [document.getElementById('gratidao1')?.value||"", document.getElementById('gratidao2')?.value||"", document.getElementById('gratidao3')?.value||""];
            d.sofa_preguica = document.getElementById('sofaPreguica')?.value || "";
            d.hd_sigiloso = document.getElementById('hdSigiloso')?.value || "";
            d.checklist_fisica = { banho:!!document.getElementById('fis_banho')?.checked, dentes:!!document.getElementById('fis_dentes')?.checked, agua:!!document.getElementById('fis_agua')?.checked, comida:!!document.getElementById('fis_comida')?.checked, sol:!!document.getElementById('fis_sol')?.checked, movimento:!!document.getElementById('fis_movimento')?.checked };
            d.checklist_autocuidado = { medicamentos:!!document.getElementById('auto_med')?.checked, terapia:!!document.getElementById('auto_ter')?.checked, amorProprio:!!document.getElementById('auto_amor')?.checked, limites:!!document.getElementById('auto_lim')?.checked, ajuda:!!document.getElementById('auto_aju')?.checked, detox:!!document.getElementById('auto_detox')?.checked, skincare:!!document.getElementById('auto_skincare')?.checked, arrumarCama:!!document.getElementById('auto_cama')?.checked, hobby:!!document.getElementById('auto_hobby')?.checked };
            saveAll();
        }
        document.querySelectorAll('#page0 input, #page0 textarea').forEach(el => {
            if(el.id && el.tagName === 'INPUT' && el.type === 'checkbox') el.addEventListener('change', capturePage0);
            else if(el.id && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox'))) el.addEventListener('input', capturePage0);
        });
    }
    
    function openDiarioModal() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let modal = document.createElement('div'); modal.className='modal';
        modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3>Como foi o episódio de hoje?</h3><span class="close-modal">&times;</span></div><textarea id="modalDiarioText" rows="6" placeholder="Escreva como foi seu dia...">${data.diario_texto||""}</textarea><label style="color:#aaa;font-size:0.7rem;">Adicionar foto</label><input type="file" id="modalPhoto" accept="image/*"><button class="btn-red" id="saveModalBtn">Salvar</button></div>`;
        document.body.appendChild(modal); modal.style.display='flex';
        modal.querySelector('.close-modal').onclick = () => modal.remove();
        document.getElementById('saveModalBtn').onclick = () => {
            let texto = document.getElementById('modalDiarioText').value;
            let file = document.getElementById('modalPhoto').files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = e => {
                    if(users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate].diario_texto = texto;
                    users[currentUser].diarios[currentDate].diario_foto = e.target.result;
                    saveAll(); modal.remove();
                };
                reader.readAsDataURL(file);
            } else {
                if(users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate].diario_texto = texto;
                saveAll(); modal.remove();
            }
        };
    }
    
    function renderPagina1() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let html = `<div class="section"><h3>Catálogo emocional de hoje</h3><div class="grid-emocoes">`;
        emocoesList.forEach(emo => {
            let e = data.emocoes[emo] || { intensidade:0, gatilho:"", pensamentos:"", outra_forma:"", descricao:"" };
            html += `<div class="emo-acordeon"><div class="emo-header" data-emo="${emo}"><h4>${emo}</h4><span>+</span></div><div class="emo-content" id="emoContent_${emo}">
                <div class="emo-question"><label>Intensidade (0-100%)</label><input type="range" id="emo_int_${emo}" min="0" max="100" value="${e.intensidade}"><span>${e.intensidade}%</span></div>
                <div class="emo-question"><label>Gatilho</label><textarea id="emo_gat_${emo}">${e.gatilho}</textarea></div>
                <div class="emo-question"><label>Pensamentos automáticos</label><textarea id="emo_pens_${emo}">${e.pensamentos}</textarea></div>
                <div class="emo-question"><label>Como posso ver de outra forma?</label><textarea id="emo_outra_${emo}">${e.outra_forma}</textarea></div>
                <div class="emo-question"><label>Descreva o que aconteceu</label><textarea id="emo_desc_${emo}">${e.descricao}</textarea></div>
            </div></div>`;
        });
        html += `</div></div>`;
        document.getElementById('page1').innerHTML = html;
        document.querySelectorAll('.emo-header').forEach(h => {
            h.onclick = () => {
                let emo = h.dataset.emo;
                let c = document.getElementById(`emoContent_${emo}`);
                let icon = h.querySelector('span');
                c.classList.toggle('open');
                icon.innerText = c.classList.contains('open') ? '-' : '+';
            };
        });
    }
    
    function renderPagina2() {
        document.getElementById('page2').innerHTML = `<div class="section"><h3>Entenda o que levou sua mente à desregulação</h3>
            <div class="info-card"><h4>DESREGULAÇÃO FÍSICA</h4><div class="checklist-vertical"><label><input type="checkbox"> Você comeu direito hoje?</label><label><input type="checkbox"> Dormiu bem recentemente?</label><label><input type="checkbox"> Seu corpo estava cansado?</label></div></div>
            <div class="info-card"><h4>DESREGULAÇÃO SENSORIAL</h4><div class="checklist-vertical"><label><input type="checkbox"> O ambiente estava barulhento?</label><label><input type="checkbox"> Havia muitas pessoas?</label></div></div>
            <div class="info-card"><h4>DESREGULAÇÃO EMOCIONAL</h4><div class="checklist-vertical"><label><input type="checkbox"> Você já estava emocionalmente cansada?</label><label><input type="checkbox"> Você se sentiu rejeitada?</label></div></div>
            <p class="text-small">A desregulação não aparece do nada. É um sinal de que algo ficou sobrecarregado.</p></div>`;
    }
    
    function renderPagina3() {
        document.getElementById('page3').innerHTML = `<div class="section"><h3>Reconstruindo a cena</h3>
            <div class="info-card"><h4>SITUAÇÃO CENTRAL</h4><textarea placeholder="Descreva o que aconteceu..."></textarea><div class="sugestoes-chips"><div class="chip">Briguei com alguém</div><div class="chip">Crítica no trabalho</div><div class="chip">Me senti rejeitada</div></div></div>
            <div class="info-card"><h4>ACEITO</h4><textarea placeholder="Aceito essa situação quando..."></textarea></div>
            <div class="info-card"><h4>AGRADEÇO</h4><textarea placeholder="Agradeço essa situação porque..."></textarea></div>
            <div class="info-card"><h4>NÃO ME FAZ BEM</h4><textarea placeholder="Nessa situação, não me faz bem..."></textarea></div>
            <div class="info-card"><h4>FAZ-ME BEM</h4><textarea placeholder="Nessa situação, faz-me bem..."></textarea></div>
            <div class="info-card"><h4>DEIXO IR</h4><textarea placeholder="Dessa situação, escolho deixar ir..."></textarea></div>
            <div class="info-card"><h4>DESFRUTO</h4><textarea placeholder="Mesmo nessa situação, ainda consigo desfrutar..."></textarea></div>
            <div class="info-card"><h4>NÃO PRECISO DISTO</h4><textarea placeholder="Depois dessa situação, não preciso mais..."></textarea></div>
        </div>`;
    }

    function renderArquivos() {
        let diarios = users[currentUser]?.diarios || {};
        let dates = Object.keys(diarios).sort().reverse();
        let html = `<div class="vhs-container">`;
        dates.forEach(d => { html += `<div class="vhs-card" data-data="${d}"><div class="vhs-date">${d}</div><div class="vhs-info">Ver episódio</div></div>`; });
        html += `</div>`;
        document.getElementById('page8').innerHTML = html;
        document.querySelectorAll('.vhs-card').forEach(c => { c.onclick = () => { currentDate = c.dataset.data; loadAll(); changePage(0); }; });
    }
    
    function loadAll() {
        if(!users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate] = getEmptyDiary();
        let select = document.getElementById('historySelect');
        if(select) {
            let dates = Object.keys(users[currentUser].diarios).sort().reverse();
            select.innerHTML = '<option value="hoje">Hoje</option>';
            dates.forEach(d => { if(d !== new Date().toISOString().slice(0,10)) select.innerHTML += `<option value="${d}">${d}</option>`; });
            select.value = currentDate === new Date().toISOString().slice(0,10) ? "hoje" : currentDate;
        }
    }
    
    function initDashboard() {
        let today = new Date().toISOString().slice(0,10);
        if(!users[currentUser].diarios) users[currentUser].diarios = {};
        if(!users[currentUser].diarios[today]) users[currentUser].diarios[today] = getEmptyDiary();
        currentDate = today;
        loadAll();
        document.getElementById('currentUserDisplay').innerText = currentUser;
        document.getElementById('avatarBtn').innerText = currentUser.charAt(0).toUpperCase();
        document.getElementById('saveEntryBtn').onclick = () => { alert("Episódio salvo!"); };
        document.getElementById('historySelect').onchange = (e) => {
            let val = e.target.value === "hoje" ? new Date().toISOString().slice(0,10) : e.target.value;
            currentDate = val;
            loadAll();
        };
        document.getElementById('logoutBtn').onclick = () => {
            currentUser = null;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
        };
        let nav = document.getElementById('pageNav');
        nav.innerHTML = pageNames.map((n,i) => `<button class="page-btn" data-page="${i}">${n}</button>`).join('');
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.onclick = () => changePage(parseInt(btn.dataset.page));
        });
        changePage(0);
    }
    
    let isLoginMode = true;
    function handleLogin() {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        if(!user || !pass) { document.getElementById('loginError').innerText = "Preencha usuário e senha."; return; }
        if(isLoginMode) {
            if(users[user] && users[user].senha === pass) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            } else { document.getElementById('loginError').innerText = "Usuário ou senha incorretos."; }
        } else {
            if(users[user]) { document.getElementById('loginError').innerText = "Usuário já existe."; }
            else {
                users[user] = { senha: pass, diarios: {} };
                localStorage.setItem('netpsi_users', JSON.stringify(users));
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            }
        }
    }
    
    document.getElementById('submitBtn').onclick = handleLogin;
    document.getElementById('loginPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('loginUser').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('switchBtn').onclick = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('formTitle').innerText = isLoginMode ? "Entrar na sua temporada" : "Criar sua temporada";
        document.getElementById('submitBtn').innerText = isLoginMode ? "Entrar" : "Criar conta";
        document.getElementById('switchBtn').innerText = isLoginMode ? "Criar sua temporada" : "Já tenho conta";
        document.getElementById('loginError').innerText = "";
    };
</script>
