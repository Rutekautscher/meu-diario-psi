<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>NETPSI - Seu Diário Terapêutico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #141414;
            color: #e5e5e5;
            font-family: 'Helvetica Neue', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            font-weight: 300;
            line-height: 1.5;
        }

        .netflix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a, #000000);
            z-index: -2;
        }

        .netflix-bg-color {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #0a0a0a, #1a0a0a, #1a1a1a, #0a0a0a);
            background-size: 400% 400%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
            animation: gradientMove 15s ease infinite;
        }

        .netflix-bg-color.active {
            opacity: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            z-index: 1;
        }

        .netpsi-logo {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 900;
            color: #E50914;
            text-shadow: 0 0 15px rgba(229,9,20,0.5), 0 0 30px rgba(229,9,20,0.3);
            letter-spacing: -2px;
            text-align: center;
        }

        .tagline {
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            font-weight: 300;
            color: #ccc;
            text-align: center;
            margin: 0.5rem 0 0.25rem;
        }

        .producer {
            font-size: 0.7rem;
            color: #888;
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-card {
            background: rgba(0,0,0,0.8);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229,9,20,0.3);
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: #333;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 300;
        }

        .input-group input:focus {
            outline: none;
            background: #454545;
            box-shadow: 0 0 0 2px #E50914;
        }

        .btn-red {
            background: #E50914;
            color: white;
            border: none;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-red:hover {
            background: #f6121d;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #E50914;
            color: #E50914;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            background: rgba(229,9,20,0.15);
        }

        .switch-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            margin-top: 1rem;
            cursor: pointer;
            font-size: 0.85rem;
            width: 100%;
        }

        .switch-btn:hover {
            color: #E50914;
        }

        .error-msg {
            color: #E50914;
            font-size: 0.75rem;
            margin-top: 0.8rem;
            text-align: center;
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #b3b3b3;
            line-height: 1.6;
            font-style: italic;
            max-width: 320px;
        }

        .dashboard {
            display: none;
            padding-bottom: 4rem;
            z-index: 1;
        }

        .nav-bar {
            background: linear-gradient(to bottom, #000000cc, #141414);
            padding: 0.8rem 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .nav-left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
        }

        .nav-logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: #E50914;
            letter-spacing: -1px;
        }

        .page-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .page-btn {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 0.3rem 0.7rem;
            cursor: pointer;
            font-size: 0.7rem;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .page-btn.active {
            background: #E50914;
            color: white;
        }

        .page-btn:hover:not(.active) {
            background: rgba(229,9,20,0.3);
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: #000;
            border: 2px solid #E50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: #E50914;
            cursor: pointer;
        }

        .btn-logout {
            background: #E50914;
            border: none;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .save-bar {
            background: #1f1f1f;
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            border-bottom: 1px solid #333;
        }

        .btn-save {
            background: #E50914;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .history-select {
            background: #333;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: none;
            font-size: 0.75rem;
        }

        .page-container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .section {
            background: #1f1f1f;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border-left: 4px solid #E50914;
        }

        .section h3 {
            color: #E50914;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr 1fr;
            }
            .page-btn {
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }
        }

        input, textarea, select {
            background: #2a2a2a;
            border: none;
            padding: 0.6rem;
            color: white;
            border-radius: 8px;
            width: 100%;
            font-size: 0.85rem;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #E50914;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .tv-smart {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #E50914;
        }

        .tv-smart:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(229,9,20,0.3);
        }

        .tv-screen {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }

        .tv-screen span {
            font-size: 1.2rem;
            font-weight: 500;
            color: #E50914;
        }

        .tv-stand {
            width: 60px;
            height: 8px;
            background: #444;
            margin: 0 auto;
            border-radius: 4px;
        }

        .checklist-vertical {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .checklist-vertical label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .checklist-vertical input {
            width: auto;
            margin-top: 0;
        }

        .estrela-options {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
            flex-wrap: wrap;
        }

        .estrela-option {
            padding: 0.3rem 1rem;
            background: #2a2a2a;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .estrela-option.selected {
            background: #E50914;
            color: white;
        }

        .claquete-btn {
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }

        .claquete-btn:hover {
            transform: scale(1.05);
        }

        .atividade-revelada {
            background: #2a2a2a;
            padding: 0.8rem;
            border-radius: 12px;
            margin-top: 0.8rem;
            text-align: center;
            display: none;
            border: 1px solid #E50914;
        }

        .testes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .testes-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1.5rem;
            }
        }

        .testes-coluna {
            background: #1f1f1f;
            border-radius: 12px;
            padding: 1rem;
        }

        .testes-coluna h3 {
            color: #E50914;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-align: center;
        }

        .teste-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid #444;
        }

        .teste-card:hover {
            background: #3a3a3a;
            transform: translateX(5px);
            border-color: #E50914;
        }

        .teste-card h4 {
            color: #E50914;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .teste-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .teste-modal-content {
            background: #1f1f1f;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            border-left: 4px solid #E50914;
        }

        .teste-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            color: #E50914;
        }

        .close-modal {
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #E50914;
            transition: width 0.3s;
        }

        .pergunta-texto {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .opcoes {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .opcao {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem;
            background: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .opcao:hover {
            background: #3a3a3a;
        }

        .opcao.selected {
            background: #E50914;
            color: white;
        }

        .opcao input {
            width: auto;
            margin: 0;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
        }

        .hidden {
            display: none;
        }

        .resultado-area {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
        }

        .text-small {
            font-size: 0.7rem;
            color: #aaa;
        }

        .vhs-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
        }

        .vhs-card {
            background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
            border-radius: 12px;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #E50914;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .vhs-card::before {
            content: "SIDE A LOW QUALITY NOISE TAPE";
            position: absolute;
            bottom: 4px;
            left: 6px;
            font-size: 0.5rem;
            color: #666;
            opacity: 0.6;
            white-space: nowrap;
        }

        .vhs-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(229,9,20,0.3);
        }

        .vhs-date {
            font-size: 0.9rem;
            font-weight: 600;
            color: #E50914;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
<div class="netflix-bg"></div>
<div class="netflix-bg-color" id="netflixColorBg"></div>

<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">
        Dados sigilosos,<br>
        aqui ninguém assiste sua série,<br>
        suas emoções são apenas suas.
    </div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-left">
            <div class="nav-logo">NETPSI</div>
            <div class="page-nav" id="pageNav"></div>
        </div>
        <div class="user-info">
            <div class="avatar" id="avatarBtn">N</div>
            <span id="currentUserDisplay"></span>
            <button class="btn-logout" id="logoutBtn">Sair</button>
        </div>
    </div>
    <div class="save-bar">
        <button class="btn-save" id="saveEntryBtn">Salvar episódio de hoje</button>
        <select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select>
    </div>

    <div id="page0" class="page-container"></div>
    <div id="page1" class="page-container hidden"></div>
    <div id="page2" class="page-container hidden"></div>
    <div id="page3" class="page-container hidden"></div>
    <div id="page4" class="page-container hidden"></div>
    <div id="page5" class="page-container hidden"></div>
    <div id="page6" class="page-container hidden"></div>
    <div id="page7" class="page-container hidden"></div>
    <div id="page8" class="page-container hidden"></div>
    <div id="page9" class="page-container hidden"></div>
</div>

<script>
    // BANCO DE DADOS DOS TESTES (CARREGAMENTO SOB DEMANDA)
    const testesDatabase = {
        autoestima: {
            titulo: "AUTOESTIMA",
            descricao: "O teste de autoestima mede como você se enxerga, como você se trata e o quanto você acredita no seu próprio valor. Baseado na Escala de Autoestima de Rosenberg.",
            perguntas: [
                "Eu sinto que sou uma pessoa de valor, pelo menos no mesmo nível que as outras pessoas.",
                "Eu sinto que tenho várias qualidades.",
                "No geral eu acho que sou um fracasso.",
                "Eu sou capaz de fazer as coisas tão bem quanto a maioria das pessoas.",
                "Eu sinto que não tenho muito do que me orgulhar.",
                "Eu tenho uma atitude positiva em relação a mim mesmo.",
                "No geral estou satisfeito comigo mesmo.",
                "Eu gostaria de ter mais respeito por mim mesmo.",
                "Às vezes eu me sinto inútil.",
                "Às vezes eu acho que não presto pra nada."
            ],
            opcoes: ["Discordo totalmente", "Discordo", "Concordo", "Concordo totalmente"],
            calcular: function(respostas) {
                let invertidas = [2, 4, 7, 8, 9];
                let total = 0;
                for(let i=0; i<respostas.length; i++) {
                    let val = respostas[i] + 1;
                    if(invertidas.includes(i)) val = 4 - val;
                    total += val;
                }
                if(total <= 25) return "Autoestima baixa. Você tende a se desvalorizar, se criticar demais e duvidar do seu valor.";
                if(total <= 30) return "Autoestima média. Você tem uma base razoável mas ainda oscila bastante dependendo das circunstâncias.";
                return "Autoestima elevada. Você se conhece, se respeita e tem uma relação saudável consigo mesmo.";
            }
        },
        burnout: {
            titulo: "BURNOUT",
            descricao: "O teste de burnout avalia o nível de esgotamento físico, emocional e mental. Baseado no Maslach Burnout Inventory.",
            perguntas: [
                "Me sinto emocionalmente esgotado pelo meu trabalho ou pelas minhas responsabilidades.",
                "Me sinto cansado ao acordar sabendo que tenho mais um dia pela frente.",
                "Sinto que estou no limite da minha capacidade emocional.",
                "Me sinto frustrado com frequência sem conseguir identificar claramente o motivo.",
                "Sinto que não tenho mais energia para me dedicar às pessoas ao meu redor.",
                "Me sinto sobrecarregado com a quantidade de coisas que preciso dar conta.",
                "Termino o dia completamente sem energia mesmo quando não fiz grandes esforços físicos.",
                "Sinto que dar de mim mesmo está me custando muito.",
                "Me sinto vazio emocionalmente com frequência.",
                "Tenho dificuldade de me recuperar mesmo depois de descansar."
            ],
            opcoes: ["Nunca", "Raramente", "Às vezes", "Frequentemente", "Sempre"],
            calcular: function(respostas) {
                let total = respostas.reduce((a,b)=>a+b+1,0);
                if(total <= 20) return "Nível baixo de burnout. Você está bem, continue cuidando da sua rotina.";
                if(total <= 35) return "Nível moderado. Há sinais de alerta. Revisar sua rotina e limites.";
                return "Nível alto. Você está em processo de esgotamento. Busque apoio profissional.";
            }
        }
    };

    function abrirTeste(testId) {
        const teste = testesDatabase[testId];
        if(!teste) return;
        
        let modal = document.createElement('div');
        modal.className = 'teste-modal';
        modal.innerHTML = `
            <div class="teste-modal-content" id="testeModalContent">
                <div class="teste-modal-header">
                    <h3>${teste.titulo}</h3>
                    <span class="close-modal">&times;</span>
                </div>
                <div id="testeEtapa">
                    <p>${teste.descricao}</p>
                    <p class="text-small" style="margin-top:0.5rem;">Atencao: Este teste tem carater informativo e de triagem. Nao substitui avaliacao profissional.</p>
                    <button class="btn-red" id="iniciarTesteBtn" style="margin-top:1rem;">INICIAR TESTE</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.style.display = 'flex';
        
        let respostas = [];
        let perguntaAtual = 0;
        
        function mostrarPergunta() {
            const etapaDiv = document.getElementById('testeEtapa');
            const pergunta = teste.perguntas[perguntaAtual];
            etapaDiv.innerHTML = `
                <div class="progress-bar"><div class="progress-fill" style="width:${((perguntaAtual+1)/teste.perguntas.length)*100}%"></div></div>
                <div class="pergunta-texto">${pergunta}</div>
                <div class="opcoes" id="opcoesContainer"></div>
                <div class="nav-buttons">
                    <button class="btn-outline" id="voltarBtn" ${perguntaAtual===0?'disabled style="opacity:0.5"':''}> VOLTAR</button>
                    <button class="btn-red" id="proximoBtn">${perguntaAtual===teste.perguntas.length-1?'CALCULAR RESULTADO':'PROXIMA'}</button>
                </div>
            `;
            const opcoesDiv = document.getElementById('opcoesContainer');
            teste.opcoes.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'opcao';
                if(respostas[perguntaAtual] === idx) div.classList.add('selected');
                div.innerHTML = `<input type="radio" name="opcao" value="${idx}" ${respostas[perguntaAtual]===idx?'checked':''}> ${opt}`;
                div.onclick = () => {
                    document.querySelectorAll('.opcao').forEach(o => o.classList.remove('selected'));
                    div.classList.add('selected');
                    document.querySelector(`input[name="opcao"]`).checked = true;
                    respostas[perguntaAtual] = idx;
                };
                opcoesDiv.appendChild(div);
            });
            
            document.getElementById('voltarBtn')?.addEventListener('click', () => {
                if(perguntaAtual > 0) {
                    perguntaAtual--;
                    mostrarPergunta();
                }
            });
            document.getElementById('proximoBtn')?.addEventListener('click', () => {
                if(respostas[perguntaAtual] === undefined) {
                    alert('Por favor, selecione uma resposta.');
                    return;
                }
                if(perguntaAtual < teste.perguntas.length - 1) {
                    perguntaAtual++;
                    mostrarPergunta();
                } else {
                    const resultado = teste.calcular(respostas);
                    const etapaDiv = document.getElementById('testeEtapa');
                    etapaDiv.innerHTML = `
                        <div class="resultado-area">
                            <h4>RESULTADO</h4>
                            <p>${resultado}</p>
                        </div>
                        <p class="text-small">Atencao: Este resultado e apenas para fins informativos. Nenhum teste online substitui uma avaliacao psicologica ou neuropsicologica completa realizada por profissional qualificado.</p>
                        <div class="nav-buttons" style="margin-top:1rem;">
                            <button class="btn-outline" id="fazerNovamenteBtn">FAZER NOVAMENTE</button>
                            <button class="btn-red" id="fecharTesteBtn">FECHAR</button>
                        </div>
                    `;
                    document.getElementById('fazerNovamenteBtn')?.addEventListener('click', () => {
                        respostas = [];
                        perguntaAtual = 0;
                        mostrarPergunta();
                    });
                    document.getElementById('fecharTesteBtn')?.addEventListener('click', () => modal.remove());
                }
            });
        }
        
        document.getElementById('iniciarTesteBtn')?.addEventListener('click', () => {
            respostas = [];
            perguntaAtual = 0;
            mostrarPergunta();
        });
        modal.querySelector('.close-modal')?.addEventListener('click', () => modal.remove());
    }

    function renderTestes() {
        const producoes = ['autoestima', 'burnout'];
        const pilotos = ['autoestima'];

                <p class="text-small" style="background:#2a2a2a; padding:1rem; border-radius:8px;">ATENCAO: os testes abaixo tem carater informativo e de triagem. Nenhum deles substitui uma avaliacao neuropsicologica completa realizada por profissional qualificado.</p>

    // PAGINA 9 - ARQUIVOS
    function renderArquivos() {
        document.getElementById('page9').innerHTML = `<div class="vhs-container"><div class="vhs-card"><div class="vhs-date">---</div><div class="vhs-info">Nenhum episodio salvo</div></div></div>`;
    }

    // INICIALIZACAO
    let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
    let currentUser = null;
    let currentDate = new Date().toISOString().slice(0,10);
    let currentPage = 0;
    const pageNames = ["EPISODIO", "TERMOMETRO", "PIPOCA", "PIPOQUEIRA", "SAGA", "COADJUVANTES", "RODA", "IKIGAI", "TESTES", "ARQUIVO"];
    const pageKeys = ['page0','page1','page2','page3','page4','page5','page6','page7','page8','page9'];
    
    function changePage(page) {
        currentPage = page;
        for(let i=0;i<pageKeys.length;i++) document.getElementById(pageKeys[i]).classList.add('hidden');
        document.getElementById(pageKeys[page]).classList.remove('hidden');
        document.querySelectorAll('.page-btn').forEach((btn,idx)=>{ if(idx==page) btn.classList.add('active'); else btn.classList.remove('active'); });
        if(page===9) { document.getElementById('netflixColorBg').classList.add('active'); renderArquivos(); }
        else document.getElementById('netflixColorBg').classList.remove('active');
    }
    
    function initDashboard() {
        renderPagina0();
        renderTestes();
        renderArquivos();
        document.getElementById('currentUserDisplay').innerText = currentUser;
        document.getElementById('saveEntryBtn').onclick = () => alert("Episodio salvo");
        document.getElementById('historySelect').onchange = (e) => console.log(e.target.value);
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; document.getElementById('dashboard').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; };
        let nav = document.getElementById('pageNav');
        nav.innerHTML = pageNames.map((n,i)=>`<button class="page-btn ${i===0?'active':''}" data-page="${i}">${n}</button>`).join('');
        document.querySelectorAll('.page-btn').forEach(btn => { btn.onclick = () => { changePage(parseInt(btn.dataset.page)); }; });
        changePage(0);
    }
    
    // LOGIN
    let isLoginMode = true;
    document.getElementById('submitBtn').onclick = () => {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        if(!user||!pass){ document.getElementById('loginError').innerText="Preencha usuario e senha."; return; }
        if(isLoginMode){
            if(users[user] && users[user].senha===pass){ currentUser=user; document.getElementById('loginScreen').style.display='none'; document.getElementById('dashboard').style.display='block'; initDashboard(); }
            else document.getElementById('loginError').innerText="Usuario ou senha incorretos.";
        } else {
            if(users[user]) document.getElementById('loginError').innerText="Usuario ja existe.";
            else { users[user]={ senha:pass, diarios:{} }; localStorage.setItem('netpsi_users',JSON.stringify(users)); currentUser=user; document.getElementById('loginScreen').style.display='none'; document.getElementById('dashboard').style.display='block'; initDashboard(); }
        }
    };
    document.getElementById('switchBtn').onclick = () => { isLoginMode=!isLoginMode; document.getElementById('formTitle').innerText=isLoginMode?"Entrar na sua temporada":"Criar sua temporada"; document.getElementById('submitBtn').innerText=isLoginMode?"Entrar":"Criar conta"; document.getElementById('switchBtn').innerText=isLoginMode?"Criar sua temporada":"Ja tenho conta"; document.getElementById('loginError').innerText=""; };
</script>
