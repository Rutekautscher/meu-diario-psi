<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NETPSI - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #141414; font-family: Arial, sans-serif; }
        .login-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .netpsi-logo { font-size: 4rem; font-weight: bold; color: #E50914; text-align: center; margin-bottom: 1rem; }
        .tagline { color: #ccc; text-align: center; margin-bottom: 0.5rem; }
        .producer { color: #888; font-size: 0.7rem; text-align: center; margin-bottom: 2rem; }
        .login-card { background: rgba(0,0,0,0.8); padding: 2rem; border-radius: 8px; width: 90%; max-width: 350px; }
        .login-card h2 { color: white; margin-bottom: 1rem; }
        .input-group { margin-bottom: 1rem; }
        .input-group input { width: 100%; padding: 0.8rem; background: #333; border: none; border-radius: 4px; color: white; font-size: 1rem; }
        .btn-red { background: #E50914; color: white; border: none; padding: 0.8rem; border-radius: 4px; width: 100%; cursor: pointer; margin-top: 0.5rem; font-weight: bold; }
        .switch-btn { background: none; border: none; color: #b3b3b3; margin-top: 1rem; cursor: pointer; width: 100%; }
        .error-msg { color: #E50914; font-size: 0.7rem; margin-top: 0.5rem; text-align: center; }
        .login-footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #666; font-style: italic; }
        .dashboard { display: none; padding: 1rem; }
        .nav-bar { background: #000; padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .nav-logo { color: #E50914; font-size: 1.5rem; font-weight: bold; }
        .user-info { display: flex; align-items: center; gap: 0.5rem; }
        .avatar { width: 36px; height: 36px; background: black; border: 2px solid #E50914; display: flex; align-items: center; justify-content: center; color: #E50914; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-logout { background: #E50914; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; }
        .save-bar { background: #1f1f1f; padding: 0.8rem; display: flex; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1rem; }
        .btn-save { background: #E50914; color: white; border: none; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; }
        .history-select { background: #333; color: white; padding: 0.3rem; border-radius: 20px; border: none; }
        .welcome { text-align: center; padding: 2rem; background: #1f1f1f; border-radius: 8px; margin-top: 2rem; }
        .welcome h2 { color: #E50914; margin-bottom: 1rem; }
        .avatar-menu { display: none; position: absolute; background: #1f1f1f; padding: 0.5rem; border-radius: 8px; flex-direction: column; gap: 0.3rem; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">Dados sigilosos,<br>aqui ninguém assiste sua série,<br>suas emoções são apenas suas.</div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-logo">NETPSI</div>
        <div class="user-info">
            <div class="avatar" id="avatarBtn">N</div>
            <div id="avatarMenu" class="avatar-menu"><button id="uploadAvatarBtn">Trocar Foto</button><button id="removeAvatarBtn">Remover</button></div>
            <span id="currentUserDisplay"></span>
            <button class="btn-logout" id="logoutBtn">Sair</button>
        </div>
    </div>
    <div class="save-bar">
        <button class="btn-save" id="saveEntryBtn">Salvar</button>
        <select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select>
    </div>
    <div class="welcome" id="welcomeMsg">
        <h2>Bem-vinda ao NETPSI</h2>
        <p>Seu diário terapêutico está pronto.</p>
        <p>As funcionalidades completas serão carregadas em breve.</p>
    </div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
    let currentUser = null;
    let isLoginMode = true;

    document.getElementById('submitBtn').onclick = () => {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        if(!user || !pass) {
            document.getElementById('loginError').innerText = "Preencha usuário e senha.";
            return;
        }
        if(isLoginMode) {
            if(users[user] && users[user].senha === pass) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('currentUserDisplay').innerText = user;
                document.getElementById('avatarBtn').innerText = user.charAt(0).toUpperCase();
            } else {
                document.getElementById('loginError').innerText = "Usuário ou senha incorretos.";
            }
        } else {
            if(users[user]) {
                document.getElementById('loginError').innerText = "Usuário já existe.";
            } else {
                users[user] = { senha: pass };
                localStorage.setItem('netpsi_users', JSON.stringify(users));
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('currentUserDisplay').innerText = user;
                document.getElementById('avatarBtn').innerText = user.charAt(0).toUpperCase();
            }
        }
    };

    document.getElementById('switchBtn').onclick = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('formTitle').innerText = isLoginMode ? "Entrar na sua temporada" : "Criar sua temporada";
        document.getElementById('submitBtn').innerText = isLoginMode ? "Entrar" : "Criar conta";
        document.getElementById('switchBtn').innerText = isLoginMode ? "Criar sua temporada" : "Já tenho conta";
        document.getElementById('loginError').innerText = "";
    };

    document.getElementById('logoutBtn').onclick = () => {
        currentUser = null;
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
    };

    document.getElementById('saveEntryBtn').onclick = () => { alert("Episódio salvo!"); };
    
    // Avatar menu
    let avatarBtn = document.getElementById('avatarBtn');
    let menu = document.getElementById('avatarMenu');
    avatarBtn.onclick = (e) => { e.stopPropagation(); menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex'; };
    document.addEventListener('click', () => menu.style.display = 'none');
    document.getElementById('uploadAvatarBtn').onclick = () => alert("Função de foto em breve");
    document.getElementById('removeAvatarBtn').onclick = () => alert("Função de remover foto em breve");
</script>
</body>
</html>
