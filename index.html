<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>NETPSI - Seu Diário Terapêutico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #141414; color: #e5e5e5; font-family: 'Helvetica Neue', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 300; line-height: 1.5; }
        .netflix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1a1a, #000000); z-index: -2; }
        .netflix-bg-color { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, #0a0a0a, #1a0a0a, #1a1a1a, #0a0a0a); background-size: 400% 400%; z-index: -1; opacity: 0; transition: opacity 0.5s; animation: gradientMove 15s ease infinite; }
        .netflix-bg-color.active { opacity: 1; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .login-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1.5rem; z-index: 1; }
        .netpsi-logo { font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 900; color: #E50914; text-shadow: 0 0 15px rgba(229,9,20,0.5), 0 0 30px rgba(229,9,20,0.3); letter-spacing: -2px; text-align: center; }
        .tagline { font-size: clamp(0.9rem, 4vw, 1.2rem); font-weight: 300; color: #ccc; text-align: center; margin: 0.5rem 0 0.25rem; }
        .producer { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 2rem; }
        .login-card { background: rgba(0,0,0,0.8); border-radius: 12px; padding: 2rem 1.5rem; width: 100%; max-width: 400px; backdrop-filter: blur(12px); border: 1px solid rgba(229,9,20,0.3); }
        .login-card h2 { margin-bottom: 1.5rem; font-size: 1.6rem; font-weight: 500; }
        .input-group { margin-bottom: 1rem; }
        .input-group input { width: 100%; padding: 0.9rem 1rem; background: #333; border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: 300; }
        .input-group input:focus { outline: none; background: #454545; box-shadow: 0 0 0 2px #E50914; }
        .btn-red { background: #E50914; color: white; border: none; padding: 0.8rem; font-size: 1rem; font-weight: 600; border-radius: 8px; width: 100%; cursor: pointer; transition: all 0.2s; }
        .btn-red:hover { background: #f6121d; transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid #E50914; color: #E50914; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .btn-outline:hover { background: rgba(229,9,20,0.15); }
        .switch-btn { background: none; border: none; color: #b3b3b3; margin-top: 1rem; cursor: pointer; font-size: 0.85rem; width: 100%; }
        .switch-btn:hover { color: #E50914; }
        .error-msg { color: #E50914; font-size: 0.75rem; margin-top: 0.8rem; text-align: center; }
        .login-footer { text-align: center; margin-top: 2rem; font-size: 0.75rem; color: #b3b3b3; line-height: 1.6; font-style: italic; max-width: 320px; }
        .dashboard { display: none; padding-bottom: 4rem; z-index: 1; }
        .nav-bar { background: linear-gradient(to bottom, #000000cc, #141414); padding: 0.8rem 1rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.8rem; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); }
        .nav-left { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem; }
        .nav-logo { font-size: 1.4rem; font-weight: 900; color: #E50914; letter-spacing: -1px; }
        .page-nav { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .page-btn { background: transparent; border: none; color: #aaa; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.7rem; border-radius: 20px; transition: all 0.2s; }
        .page-btn.active { background: #E50914; color: white; }
        .page-btn:hover:not(.active) { background: rgba(229,9,20,0.3); color: white; }
        .user-info { display: flex; align-items: center; gap: 0.8rem; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #E50914; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 600; }
        .btn-logout { background: #E50914; border: none; color: white; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 0.75rem; }
        .save-bar { background: #1f1f1f; padding: 0.8rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; border-bottom: 1px solid #333; }
        .btn-save { background: #E50914; color: white; border: none; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .history-select { background: #333; color: white; padding: 0.4rem 0.8rem; border-radius: 20px; border: none; font-size: 0.75rem; }
        .page-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        .section { background: #1f1f1f; border-radius: 12px; padding: 1.2rem; margin-bottom: 1.2rem; border-left: 4px solid #E50914; }
        .section h3 { color: #E50914; margin-bottom: 0.8rem; font-size: 1.1rem; font-weight: 600; }
        .section h4 { color: #E50914; margin: 0.8rem 0 0.5rem; font-size: 0.95rem; font-weight: 500; }
        .two-columns { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem; }
        @media (min-width: 768px) { .two-columns { grid-template-columns: 1fr 1fr; } .page-btn { font-size: 0.8rem; padding: 0.4rem 1rem; } }
        input, textarea, select { background: #2a2a2a; border: none; padding: 0.6rem; color: white; border-radius: 8px; width: 100%; font-size: 0.85rem; font-family: inherit; }
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px #E50914; }
        textarea { resize: vertical; min-height: 70px; }
        .claquete-container { display: flex; justify-content: center; margin: 1rem 0; }
        .claquete-btn { cursor: pointer; transition: transform 0.2s; text-align: center; }
        .claquete-btn:hover { transform: scale(1.05); }
        .claquete-svg { width: 70px; height: 70px; }
        .exercicio-label { font-size: 0.7rem; color: #888; text-align: center; margin-top: 0.3rem; }
        .atividade-revelada { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; margin-top: 0.8rem; text-align: center; display: none; border: 1px solid #E50914; }
        .atividade-revelada.visible { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .emo-acordeon { margin-bottom: 0.6rem; }
        .emo-header { background: #2a2a2a; padding: 0.7rem; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .emo-header h4 { margin: 0; color: #E50914; font-size: 0.9rem; }
        .emo-content { display: none; padding: 0.8rem; background: #252525; border-radius: 10px; margin-top: 0.4rem; }
        .emo-content.open { display: block; }
        .emo-question { margin-bottom: 0.8rem; }
        .emo-question label { font-size: 0.7rem; color: #aaa; display: block; margin-bottom: 0.2rem; }
        .estrela-options { display: flex; gap: 1rem; margin: 0.5rem 0; flex-wrap: wrap; }
        .estrela-option { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; padding: 0.3rem 1rem; background: #2a2a2a; border-radius: 30px; font-size: 0.8rem; }
        .estrela-option.selected { background: #E50914; color: white; }
        .checkbox-group { display: flex; gap: 0.8rem; flex-wrap: wrap; margin: 0.5rem 0; }
        .checkbox-group label { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; cursor: pointer; }
        .checkbox-group input { width: auto; }
        .grid-emocoes { display: grid; grid-template-columns: 1fr; gap: 0.6rem; }
        @media (min-width: 640px) { .grid-emocoes { grid-template-columns: repeat(2, 1fr); } }
        .ikigai-container { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin: 2rem 0; }
        .ikigai-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; }
        .ikigai-sphere { background: #1f1f1f; border: 2px solid #E50914; border-radius: 24px; padding: 1rem; width: 240px; text-align: center; }
        .ikigai-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.8rem; color: #ccc; }
        .ikigai-buttons { display: flex; justify-content: center; gap: 1rem; margin: 0.8rem 0; }
        .circle-btn { width: 38px; height: 38px; border-radius: 50%; background: #2a2a2a; border: 1px solid #E50914; color: #E50914; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .circle-btn:hover { background: #E50914; color: white; transform: scale(1.05); }
        .ikigai-subtitle { font-size: 0.8rem; color: #E50914; margin-top: 0.5rem; display: flex; justify-content: center; gap: 0.8rem; }
        .vhs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.2rem; }
        .vhs-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-radius: 12px; padding: 0.8rem; cursor: pointer; transition: all 0.2s; border: 1px solid #E50914; text-align: center; position: relative; overflow: hidden; }
        .vhs-card::before { content: "SIDE A LOW QUALITY NOISE TAPE 90MIN"; position: absolute; bottom: 4px; left: 6px; font-size: 0.5rem; color: #666; opacity: 0.6; white-space: nowrap; }
        .vhs-card:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(229,9,20,0.3); }
        .vhs-date { font-size: 0.9rem; font-weight: 600; color: #E50914; margin-bottom: 0.5rem; }
        .vhs-info { font-size: 0.7rem; color: #aaa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: #1f1f1f; border-radius: 16px; width: 100%; max-width: 550px; max-height: 85vh; overflow-y: auto; padding: 1.5rem; border-left: 4px solid #E50914; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; color: #E50914; }
        .close-modal { cursor: pointer; font-size: 1.5rem; line-height: 1; }
        .hidden { display: none; }
        .text-small { font-size: 0.7rem; color: #aaa; }
        .blocked-message { text-align: center; padding: 2rem; background: #1f1f1f; border-radius: 16px; color: #E50914; }
        .info-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem; }
        @media (min-width: 768px) { .info-grid { grid-template-columns: repeat(2, 1fr); } }
        .info-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; }
        .info-card h4 { color: #E50914; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .info-card ul { list-style: none; padding-left: 0; }
        .info-card li { font-size: 0.75rem; color: #ccc; padding: 0.2rem 0; padding-left: 1rem; position: relative; }
        .info-card li::before { content: "•"; color: #E50914; position: absolute; left: 0; }
        .intersections-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin: 1rem 0; }
        .intersection-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; text-align: center; }
        .intersection-card h4 { color: #E50914; margin-bottom: 0.3rem; }
        .center-ikigai { background: #2a2a2a; padding: 1rem; border-radius: 12px; text-align: center; margin: 1rem 0; }
        input[type="range"] { width: 100%; margin: 0.3rem 0; background: #333; height: 3px; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #E50914; cursor: pointer; }
        .rating-value { font-size: 0.7rem; color: #E50914; margin-left: 0.3rem; }
    </style>
</head>
<body>
<div class="netflix-bg"></div>
<div class="netflix-bg-color" id="netflixColorBg"></div>

<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">Dados sigilosos,<br>aqui ninguém assiste sua série,<br>suas emoções são apenas suas.</div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-left"><div class="nav-logo">NETPSI</div><div class="page-nav" id="pageNav"></div></div>
        <div class="user-info"><div class="avatar" id="avatar">🎬</div><span id="currentUserDisplay"></span><button class="btn-logout" id="logoutBtn">Sair</button></div>
    </div>
    <div class="save-bar"><button class="btn-save" id="saveEntryBtn">Salvar episódio de hoje</button><select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select></div>
    <div id="page0" class="page-container"></div><div id="page1" class="page-container hidden"></div><div id="page2" class="page-container hidden"></div>
    <div id="page3" class="page-container hidden"></div><div id="page4" class="page-container hidden"></div><div id="page5" class="page-container hidden"></div>
    <div id="page6" class="page-container hidden"></div><div id="page7" class="page-container hidden"></div>
</div>

<script>
// DADOS
let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
let currentUser = null;
let currentDate = new Date().toISOString().slice(0,10);
let currentPage = 0;
const pageNames = ["EPISÓDIO DE HOJE","TERMÔMETRO DO EPISÓDIO","VOLTANDO A TRANSMISSÃO","PIPOCA REGULADA","SAGA FLIX","RODANDO O SERIADO","IKIGAI FLIX","ARQUIVO X"];
const pageKeys = ['page0','page1','page2','page3','page4','page5','page6','page7'];

const exercicios = ["Escreva sobre um momento que você se sentiu orgulhoso.","Descreva uma situação de ansiedade e como lidou.","Escreva uma carta de perdão para si mesmo.","Liste 3 qualidades que admira em si.","Descreva um medo que gostaria de enfrentar.","Escreva sobre algo que aprendeu sobre si esta semana.","Se pudesse dar um conselho ao seu eu do passado, o que diria?","Descreva uma situação em que foi resiliente.","Escreva sobre algo que quer deixar para trás.","Liste pequenas alegrias do seu dia."];
function getExercicio() { return exercicios[Math.floor(Math.random() * exercicios.length)]; }

const emocoesList = ["alegria","tedio","medo","raiva","tristeza","nojo","frustracao","apatia","vergonha","ressentimento","inveja","carencia","esperanca","alivio","amor","paixao","impulso","orgulho","solidão","paciencia"];
const emocoesNomes = { alegria:"Alegria", tedio:"Tédio", medo:"Medo", raiva:"Raiva", tristeza:"Tristeza", nojo:"Nojo", frustracao:"Frustração", apatia:"Apatia", vergonha:"Vergonha", ressentimento:"Ressentimento", inveja:"Inveja", carencia:"Carência", esperanca:"Esperança", alivio:"Alívio", amor:"Amor", paixao:"Paixão", impulso:"Impulso", orgulho:"Orgulho", solidão:"Solidão", paciencia:"Paciência" };

function getEmptyDiary() {
    let emocoes = {};
    emocoesList.forEach(e => { emocoes[e] = { intensidade: 0, gatilho: "", pensamentos: "", outra_forma: "", descricao: "" }; });
    return {
        atividade_tcc: getExercicio(), humor: 5, estrela: "", estrela_roteiro: "", diario_texto: "", diario_foto: null,
        checklist_fisica: { banho: false, dentes: false, agua: false, comida: false, sol: false, movimento: false },
        checklist_autocuidado: { medicamentos: false, terapia: false, amorProprio: false, limites: false, ajuda: false },
        elogios: ["","",""], gratidao: ["","",""], melhorar_amanha: "", emocoes: emocoes,
        plano_mudanca: null, carta_nao_enviada: "", roda_vida: null, roda_vida_data: null, ikigai: null, ikigai_data: null, ikigai_respostas: {},
        pipoca: {}, saga: {}
    };
}
function saveAll() { if(currentUser) localStorage.setItem('netpsi_users', JSON.stringify(users)); }

function changePage(page) {
    currentPage = page;
    for(let i=0;i<pageKeys.length;i++) document.getElementById(pageKeys[i]).classList.add('hidden');
    document.getElementById(pageKeys[page]).classList.remove('hidden');
    document.querySelectorAll('.page-btn').forEach((btn,idx)=>{ if(idx==page) btn.classList.add('active'); else btn.classList.remove('active'); });
    if(page===7) { document.getElementById('netflixColorBg').classList.add('active'); renderArquivos(); }
    else document.getElementById('netflixColorBg').classList.remove('active');
    if(page===5) renderRodaVida();
    if(page===6) renderIkigai();
}

// PÁGINA 0
function renderPagina0(data) {
    let html = `
        <div class="section"><h3>Filme de hoje</h3><div class="claquete-container"><div class="claquete-btn" id="claqueteBtn"><svg class="claquete-svg" viewBox="0 0 100 100"><rect x="15" y="25" width="70" height="50" fill="#2a2a2a" stroke="#E50914" stroke-width="2" rx="3"/><rect x="15" y="25" width="70" height="15" fill="#E50914" rx="3"/><line x1="30" y1="32" x2="45" y2="32" stroke="white" stroke-width="2"/><line x1="55" y1="32" x2="70" y2="32" stroke="white" stroke-width="2"/><text x="32" y="60" fill="white" font-size="12" font-weight="bold">REC</text></svg></div></div><div class="exercicio-label">exercício terapêutico</div><div class="atividade-revelada" id="atividadeRevelada"><div id="atividadeTexto">${data.atividade_tcc}</div></div></div>
        <div class="section"><h3>Humor crítico</h3><input type="range" id="humorSlider" min="0" max="10" value="${data.humor}"><span class="rating-value" id="humorValue">${data.humor}/10</span></div>
        <div class="section"><h3>Como está sua estrela hoje?</h3><div class="estrela-options"><div class="estrela-option ${data.estrela==='brilhando'?'selected':''}" data-estrela="brilhando">Brilhando</div><div class="estrela-option ${data.estrela==='apagada'?'selected':''}" data-estrela="apagada">Apagada</div></div><textarea id="estrelaRoteiro" placeholder="Descreva o roteiro...">${data.estrela_roteiro}</textarea></div>
        <div class="section"><button class="btn-outline" id="openDiarioBtn">📝 Como foi o episódio de hoje?</button></div>
        <div class="two-columns"><div class="section"><h3>Checklist Saúde Física</h3><div class="checkbox-group"><label><input type="checkbox" id="fis_banho" ${data.checklist_fisica.banho?'checked':''}> Tomei banho</label><label><input type="checkbox" id="fis_dentes" ${data.checklist_fisica.dentes?'checked':''}> Escovei dentes</label><label><input type="checkbox" id="fis_agua" ${data.checklist_fisica.agua?'checked':''}> Bebi água</label></div><div class="checkbox-group"><label><input type="checkbox" id="fis_comida" ${data.checklist_fisica.comida?'checked':''}> Comi bem</label><label><input type="checkbox" id="fis_sol" ${data.checklist_fisica.sol?'checked':''}> Tomei sol</label><label><input type="checkbox" id="fis_movimento" ${data.checklist_fisica.movimento?'checked':''}> Me movimentei</label></div></div>
        <div class="section"><h3>Checklist Autocuidado</h3><div class="checkbox-group"><label><input type="checkbox" id="auto_med" ${data.checklist_autocuidado.medicamentos?'checked':''}> Tomei medicamentos</label><label><input type="checkbox" id="auto_ter" ${data.checklist_autocuidado.terapia?'checked':''}> Fui à terapia</label></div><div class="checkbox-group"><label><input type="checkbox" id="auto_amor" ${data.checklist_autocuidado.amorProprio?'checked':''}> Pratiquei amor-próprio</label><label><input type="checkbox" id="auto_lim" ${data.checklist_autocuidado.limites?'checked':''}> Estabeleci limites</label></div><div class="checkbox-group"><label><input type="checkbox" id="auto_aju" ${data.checklist_autocuidado.ajuda?'checked':''}> Pedi ajuda</label></div></div></div>
        <div class="two-columns"><div class="section"><h3>Elogie-se</h3><textarea id="elogio1" placeholder="Elogio 1">${data.elogios[0]}</textarea><textarea id="elogio2" placeholder="Elogio 2">${data.elogios[1]}</textarea><textarea id="elogio3" placeholder="Elogio 3">${data.elogios[2]}</textarea></div>
        <div class="section"><h3>Gratidão</h3><textarea id="gratidao1" placeholder="Gratidão 1">${data.gratidao[0]}</textarea><textarea id="gratidao2" placeholder="Gratidão 2">${data.gratidao[1]}</textarea><textarea id="gratidao3" placeholder="Gratidão 3">${data.gratidao[2]}</textarea></div></div>
        <div class="section"><h3>Como posso melhorar no episódio de amanhã?</h3><textarea id="melhorarAmanha">${data.melhorar_amanha}</textarea></div>
        <div class="section"><h3>Mudando o seriado da sua vida</h3><button class="btn-outline" id="openMudancaBtn">Plano de mudança</button></div>
        <div class="section"><h3>Roteiro que nunca enviei</h3><textarea id="cartaNaoEnviada" rows="3">${data.carta_nao_enviada || ""}</textarea></div>`;
    document.getElementById('page0').innerHTML = html;
    document.getElementById('claqueteBtn')?.addEventListener('click',()=>{ let nova=getExercicio(); document.getElementById('atividadeTexto').innerText=nova; let el=document.getElementById('atividadeRevelada'); el.classList.add('visible'); setTimeout(()=>el.classList.remove('visible'),4000); });
    document.getElementById('humorSlider')?.addEventListener('input',(e)=>{ document.getElementById('humorValue').innerText=e.target.value+'/10'; let v=parseInt(e.target.value); document.getElementById('avatar').innerText=v<=3?'😔':v<=6?'😐':'😊'; });
    document.querySelectorAll('.estrela-option').forEach(opt=>{ opt.onclick=()=>{ document.querySelectorAll('.estrela-option').forEach(o=>o.classList.remove('selected')); opt.classList.add('selected'); }; });
    document.getElementById('openDiarioBtn')?.addEventListener('click',()=>openDiarioModal(data));
    document.getElementById('openMudancaBtn')?.addEventListener('click',()=>openMudancaModal(data));
}

        data.melhorar_amanha = document.getElementById('melhorarAmanha')?.value || "";

    }
    if(currentPage===1){
        emocoesList.forEach(emo=>{
            data.emocoes[emo] = { intensidade: parseInt(document.getElementById(`emo_int_${emo}`)?.value)||0, gatilho: document.getElementById(`emo_gat_${emo}`)?.value||"", pensamentos: document.getElementById(`emo_pens_${emo}`)?.value||"", outra_forma: document.getElementById(`emo_outra_${emo}`)?.value||"", descricao: document.getElementById(`emo_desc_${emo}`)?.value||"" };
        });
    }
    if(currentPage===3){
        data.pipoca = { aceito:document.getElementById('pipoca_aceito')?.value, agradeco:document.getElementById('pipoca_agradeco')?.value, nao:document.getElementById('pipoca_nao')?.value, faz:document.getElementById('pipoca_faz')?.value, deixo:document.getElementById('pipoca_deixo')?.value, desfruto:document.getElementById('pipoca_desfruto')?.value, situacao:document.getElementById('pipoca_situacao')?.value };

    }
    users[currentUser].diarios[currentDate] = data;
    saveAll();
}

function loadDate(date){
    currentDate = date;
    if(!users[currentUser].diarios) users[currentUser].diarios = {};
    if(!users[currentUser].diarios[date]) users[currentUser].diarios[date] = getEmptyDiary();
    let data = users[currentUser].diarios[date];
    renderPagina0(data);
    renderPagina1(data);
    renderPagina2();
    renderPagina3(data);
    renderPagina4(data);
    updateHistorySelect();
    if(currentPage===5) renderRodaVida();
    if(currentPage===6) renderIkigai();
    if(currentPage===7) renderArquivos();
}

function updateHistorySelect(){
    let select = document.getElementById('historySelect');
    if(!select) return;
    let dates = Object.keys(users[currentUser].diarios || {}).sort().reverse();
    select.innerHTML = '<option value="hoje">Hoje</option>';
    dates.forEach(d=>{ if(d!==new Date().toISOString().slice(0,10)) select.innerHTML+=`<option value="${d}">${d}</option>`; });
    select.value = currentDate===new Date().toISOString().slice(0,10) ? "hoje" : currentDate;
}

function initDashboard(){
    let today = new Date().toISOString().slice(0,10);
    if(!users[currentUser].diarios) users[currentUser].diarios = {};
    if(!users[currentUser].diarios[today]) users[currentUser].diarios[today] = getEmptyDiary();
    currentDate = today;
    loadDate(currentDate);
    document.getElementById('currentUserDisplay').innerText = currentUser;
    document.getElementById('saveEntryBtn').onclick = ()=>{ captureFromDOM(); alert("Episódio salvo!"); loadDate(currentDate); };
    document.getElementById('historySelect').onchange = (e)=>{ let val=e.target.value==="hoje"?new Date().toISOString().slice(0,10):e.target.value; captureFromDOM(); currentDate=val; loadDate(currentDate); };
    document.getElementById('logoutBtn').onclick = ()=>{ currentUser=null; document.getElementById('dashboard').style.display='none'; document.getElementById('loginScreen').style.display='flex'; };
    let nav=document.getElementById('pageNav');
    nav.innerHTML = pageNames.map((n,i)=>`<button class="page-btn ${i===0?'active':''}" data-page="${i}">${n}</button>`).join('');
    document.querySelectorAll('.page-btn').forEach(btn=>{ btn.onclick=()=>{ captureFromDOM(); changePage(parseInt(btn.dataset.page)); }; });
    changePage(0);
}

// LOGIN
let isLoginMode=true;
document.getElementById('submitBtn').onclick = ()=>{
    let user = document.getElementById('loginUser').value.trim();
    let pass = document.getElementById('loginPass').value.trim();
    if(!user||!pass){ document.getElementById('loginError').innerText="Preencha usuário e senha."; return; }
    if(isLoginMode){
        if(users[user] && users[user].senpa===pass){ currentUser=user; document.getElementById('loginScreen').style.display='none'; document.getElementById('dashboard').style.display='block'; initDashboard(); }
        else document.getElementById('loginError').innerText="Usuário ou senha incorretos.";
    } else {
        if(users[user]) document.getElementById('loginError').innerText="Usuário já existe.";
        else { users[user]={ senha:pass, diarios:{} }; localStorage.setItem('netpsi_users',JSON.stringify(users)); currentUser=user; document.getElementById('loginScreen').style.display='none'; document.getElementById('dashboard').style.display='block'; initDashboard(); }
    }
};
document.getElementById('switchBtn').onclick = ()=>{ isLoginMode=!isLoginMode; document.getElementById('formTitle').innerText=isLoginMode?"Entrar na sua temporada":"Criar sua temporada"; document.getElementById('submitBtn').innerText=isLoginMode?"Entrar":"Criar conta"; document.getElementById('switchBtn').innerText=isLoginMode?"Criar sua temporada":"Já tenho conta"; document.getElementById('loginError').innerText=""; };
</script>
</body>
</html>
