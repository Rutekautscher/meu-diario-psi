<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário Psi</title>
    <!-- Script para o efeito de confete -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #141414; color: white; text-align: center; margin: 0; padding: 20px; }
        .box { border: 1px solid #444; padding: 20px; margin: 15px auto; width: 90%; max-width: 500px; border-radius: 10px; background: #1f1f1f; }
        h3 { color: #e50914; margin-top: 0; }
        input[type="range"] { accent-color: red; width: 100%; margin: 10px 0; }
        textarea, input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        .btn-revelar { background: #e50914; color: white; border: none; padding: 15px 30px; border-radius: 5px; margin-top: 30px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-btn { background: #e50914; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .label-text { display: block; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<!-- Tela de Entrada/Login -->
<div id="login-screen">
    <h1 style="color: #e50914; letter-spacing: 2px;">SISTEMA RESTAURADO</h1>
    <div id="login-container">
        <input type="password" id="pass" placeholder="Crie ou digite sua senha">
        <button class="login-btn" onclick="fazerLogin()">Entrar no Site</button>
    </div>
</div>

<div id="main-content" style="display:none;">
    <h1 style="color: #e50914;">Meu Diário Psi</h1>
    
    <!-- Humor Crítico -->
    <div class="box">
        <h3>Humor Crítico</h3>
        <span class="label-text">Avaliação de 0 a 10</span>
        <input type="range" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
        <output>5</output>
    </div>

    <!-- Pensamento Automático -->
    <div class="box">
        <h3>Pensamento Automático</h3>
        <textarea rows="3" placeholder="O que passou pela sua cabeça?"></textarea>
    </div>

    <!-- Reestruturação Cognitiva -->
    <div class="box">
        <h3>Reestruturação Cognitiva</h3>
        <span class="label-text">Como posso pensar diferente?</span>
        <textarea rows="3" placeholder="Desafie o pensamento anterior..."></textarea>
    </div>

    <!-- Elogios da Estrela -->
    <div class="box">
        <h3>Elogios da Estrela</h3>
        <input type="text" placeholder="Elogio 1">
        <input type="text" placeholder="Elogio 2">
        <input type="text" placeholder="Elogio 3">
    </div>

    <!-- Gratidão -->
    <div class="box">
        <h3>Gratidão pelo Episódio de Hoje</h3>
        <input type="text" placeholder="Motivo de gratidão 1">
        <input type="text" placeholder="Motivo de gratidão 2">
        <input type="text" placeholder="Motivo de gratidão 3">
    </div>

    <div style="margin-top: 40px;">
        <p style="font-size: 18px; margin-bottom: 10px;">Ingresso de Hoje</p>
        <button class="btn-revelar" onclick="revelar()">REVELAR</button>
    </div>
</div>

<!-- Elemento de áudio para o som do tudum -->
<audio id="tudum" src="tudum.mp3"></audio>

<script>
    // Função para gerenciar o login e o som
    function fazerLogin() {
        const senhaInserida = document.getElementById('pass').value;
        if(senhaInserida) {
            // Salva a senha para não precisar criar toda vez
            localStorage.setItem('meu_diario_senha', senhaInserida);
            iniciarSite();
        } else {
            alert("Por favor, digite uma senha.");
        }
    }

    function iniciarSite() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        // Toca o som do tudum
        const som = document.getElementById('tudum');
        som.play().catch(e => console.log("Som aguardando interação ou arquivo ausente."));
    }

    // Função para o botão de revelar com confetes
    function revelar() {
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ff0000', '#ffffff', '#b9090b']
        });
    }

    // Verifica se já existe uma senha salva ao carregar a página
    window.onload = () => {
        const senhaSalva = localStorage.getItem('meu_diario_senha');
        if(senhaSalva) {
            document.getElementById('login-container').innerHTML = `
                <p>Bem-vinda de volta!</p>
                <button class="login-btn" onclick="iniciarSite()">Entrar no Site</button>
            `;
        }
    };
</script>
</body>
</html>
