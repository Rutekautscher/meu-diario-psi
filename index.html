<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NETPSI - Seu Diário Terapêutico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #141414; color: #e5e5e5; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        /* Login */
        .login-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; }
        .netpsi-logo { font-size: 4rem; font-weight: 900; color: #E50914; text-shadow: 0 0 15px rgba(229,9,20,0.5); text-align: center; }
        .tagline { font-size: 1rem; color: #ccc; text-align: center; margin: 0.5rem 0; }
        .producer { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 2rem; }
        .login-card { background: rgba(0,0,0,0.8); border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .login-card h2 { margin-bottom: 1rem; font-size: 1.5rem; color: white; }
        .input-group { margin-bottom: 1rem; }
        .input-group input { width: 100%; padding: 0.8rem; background: #333; border: none; border-radius: 8px; color: white; font-size: 1rem; }
        .input-group input:focus { outline: none; box-shadow: 0 0 0 2px #E50914; }
        .btn-red { background: #E50914; color: white; border: none; padding: 0.8rem; font-size: 1rem; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 0.5rem; transition: all 0.2s; }
        .btn-red:hover { background: #f6121d; transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid #E50914; color: #E50914; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .btn-outline:hover { background: rgba(229,9,20,0.15); }
        .switch-btn { background: none; border: none; color: #b3b3b3; margin-top: 1rem; cursor: pointer; width: 100%; }
        .switch-btn:hover { color: #E50914; }
        .error-msg { color: #E50914; font-size: 0.75rem; margin-top: 0.5rem; text-align: center; }
        .login-footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #b3b3b3; font-style: italic; line-height: 1.5; }
        
        /* Dashboard */
        .dashboard { display: none; padding-bottom: 2rem; }
        .nav-bar { background: linear-gradient(to bottom, #000000cc, #141414); padding: 0.8rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 0.5rem; position: sticky; top: 0; z-index: 100; }
        .nav-logo { font-size: 1.5rem; font-weight: bold; color: #E50914; letter-spacing: -1px; }
        .page-nav { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .page-btn { background: transparent; border: none; color: #aaa; padding: 0.3rem 0.5rem; cursor: pointer; font-size: 0.65rem; border-radius: 20px; transition: all 0.2s; white-space: nowrap; }
        .page-btn.active { background: #E50914; color: white; }
        .page-btn:hover:not(.active) { background: rgba(229,9,20,0.3); color: white; }
        @media (min-width: 768px) { .page-btn { font-size: 0.75rem; padding: 0.4rem 0.8rem; } }
        
        .user-info { display: flex; align-items: center; gap: 0.8rem; }
        .avatar { width: 36px; height: 36px; background: #000; border: 2px solid #E50914; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; color: #E50914; }
        .btn-logout { background: #E50914; border: none; color: white; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 0.75rem; }
        .save-bar { background: #1f1f1f; padding: 0.8rem 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; border-bottom: 1px solid #333; }
        .btn-save { background: #E50914; color: white; border: none; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .history-select { background: #333; color: white; padding: 0.3rem 0.6rem; border-radius: 20px; border: none; font-size: 0.7rem; }
        .page-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        .section { background: #1f1f1f; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #E50914; }
        .section h3 { color: #E50914; margin-bottom: 0.5rem; font-size: 1rem; font-weight: 600; }
        .section h4 { color: #E50914; margin: 0.5rem 0 0.3rem; font-size: 0.85rem; }
        .hidden { display: none; }
        .two-columns { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem; }
        @media (min-width: 768px) { .two-columns { grid-template-columns: 1fr 1fr; } }
        
        input, textarea { background: #2a2a2a; border: none; padding: 0.5rem; color: white; border-radius: 8px; width: 100%; font-size: 0.85rem; font-family: inherit; margin-bottom: 0.5rem; }
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px #E50914; }
        textarea { resize: vertical; min-height: 60px; }
        
        .checklist-vertical { display: flex; flex-direction: column; gap: 0.3rem; }
        .checklist-vertical label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; cursor: pointer; }
        .checklist-vertical input { width: auto; margin-bottom: 0; }
        
        .estrela-options { display: flex; gap: 1rem; margin: 0.5rem 0; flex-wrap: wrap; }
        .estrela-option { background: #2a2a2a; padding: 0.3rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .estrela-option.selected { background: #E50914; color: white; }
        
        .tv-smart { background: #2a2a2a; border-radius: 20px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s; border: 1px solid #E50914; margin-bottom: 0.5rem; }
        .tv-smart:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(229,9,20,0.3); }
        .tv-screen { background: #0a0a0a; border-radius: 10px; padding: 0.8rem; margin-bottom: 0.5rem; }
        .tv-stand { width: 50px; height: 6px; background: #444; margin: 0 auto; border-radius: 4px; }
        
        .emo-acordeon { margin-bottom: 0.5rem; }
        .emo-header { background: #2a2a2a; padding: 0.5rem; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .emo-header h4 { margin: 0; color: #E50914; font-size: 0.85rem; }
        .emo-content { display: none; padding: 0.5rem; background: #252525; border-radius: 8px; margin-top: 0.3rem; }
        .emo-content.open { display: block; }
        .emo-question { margin-bottom: 0.5rem; }
        .emo-question label { font-size: 0.7rem; color: #aaa; display: block; margin-bottom: 0.2rem; }
        
        .text-small { font-size: 0.7rem; color: #aaa; }
        .blocked-message { text-align: center; padding: 2rem; background: #1f1f1f; border-radius: 16px; color: #E50914; }
        .info-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; margin-bottom: 0.8rem; }
        .info-card h4 { color: #E50914; margin-bottom: 0.3rem; font-size: 0.85rem; }
        
        .vhs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
        .vhs-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-radius: 12px; padding: 0.8rem; cursor: pointer; transition: all 0.2s; border: 1px solid #E50914; text-align: center; position: relative; overflow: hidden; }
        .vhs-card::before { content: "SIDE A LOW QUALITY NOISE TAPE"; position: absolute; bottom: 4px; left: 6px; font-size: 0.5rem; color: #666; opacity: 0.6; white-space: nowrap; }
        .vhs-card:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(229,9,20,0.3); }
        .vhs-date { font-size: 0.85rem; font-weight: 600; color: #E50914; margin-bottom: 0.3rem; }
        
        .grid-emocoes { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
        @media (min-width: 640px) { .grid-emocoes { grid-template-columns: repeat(2, 1fr); } }
        
        .progress-bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 0.3rem 0; }
        .progress-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.3s; }
        .progress-fill.critico { background: #8B0000; }
        .progress-fill.atencao { background: #FF8C00; }
        .progress-fill.regular { background: #FFD700; }
        .progress-fill.bom { background: #228B22; }
        
        .pergunta-card { background: #2a2a2a; border-radius: 10px; margin-bottom: 0.5rem; overflow: hidden; }
        .pergunta-header { background: #333; padding: 0.6rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .pergunta-header:hover { background: #3a3a3a; }
        .pergunta-header h4 { margin: 0; font-size: 0.8rem; color: #E50914; }
        .pergunta-content { display: none; padding: 0.8rem; background: #252525; }
        .pergunta-content.open { display: block; }
        .sugestoes-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
        .chip { background: #3a3a3a; padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.7rem; cursor: pointer; transition: all 0.2s; }
        .chip:hover { background: #E50914; color: white; }
        
        .camera-box { background: #1f1f1f; border: 3px solid #E50914; border-radius: 16px; padding: 1rem; text-align: center; margin: 1rem 0; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: #1f1f1f; border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 1rem; border-left: 4px solid #E50914; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; color: #E50914; }
        .close-modal { cursor: pointer; font-size: 1.3rem; }
        
        input[type="range"] { width: 100%; margin: 0.3rem 0; background: #333; height: 4px; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #E50914; cursor: pointer; }
        .rating-value { font-size: 0.7rem; color: #E50914; margin-left: 0.3rem; }
        
        .ikigai-circles { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin: 1rem 0; }
        .ikigai-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; }
        .ikigai-sphere { background: #1f1f1f; border: 2px solid #E50914; border-radius: 20px; padding: 0.8rem; width: 220px; text-align: center; }
        .ikigai-title { font-size: 0.75rem; font-weight: 500; margin-bottom: 0.5rem; color: #ccc; }
        .circle-btn { width: 30px; height: 30px; border-radius: 50%; background: #2a2a2a; border: 1px solid #E50914; color: #E50914; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; margin: 0.2rem; }
        .circle-btn:hover { background: #E50914; color: white; }
        .ikigai-section { margin-bottom: 1rem; background: #2a2a2a; padding: 0.8rem; border-radius: 12px; }
        .ikigai-explicacao { font-size: 0.75rem; color: #ccc; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">Dados sigilosos,<br>aqui ninguém assiste sua série,<br>suas emoções são apenas suas.</div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-logo">NETPSI</div>
        <div class="page-nav" id="pageNav"></div>
        <div class="user-info"><div class="avatar" id="avatarBtn">N</div><span id="currentUserDisplay"></span><button class="btn-logout" id="logoutBtn">Sair</button></div>
    </div>
    <div class="save-bar"><button class="btn-save" id="saveEntryBtn">Salvar episódio de hoje</button><select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select></div>
    <div id="page0" class="page-container"></div>
    <div id="page1" class="page-container hidden"></div>
    <div id="page2" class="page-container hidden"></div>
    <div id="page3" class="page-container hidden"></div>
    <div id="page4" class="page-container hidden"></div>
    <div id="page5" class="page-container hidden"></div>
    <div id="page6" class="page-container hidden"></div>
    <div id="page7" class="page-container hidden"></div>
    <div id="page8" class="page-container hidden"></div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
    let currentUser = null;
    let currentDate = new Date().toISOString().slice(0,10);
    let currentPage = 0;
    const pageNames = ["EPISÓDIO", "CINEMOÇÕES", "CRISEPLAY", "REPLAY", "NEUROFLIX", "COADJUVANTES", "DIAGNOSTIFLIX", "IKIGAI FLIX", "ARQUIVO X"];
    const pageKeys = ['page0','page1','page2','page3','page4','page5','page6','page7','page8'];
    
    const emocoesList = ["Alegria","Tédio","Medo","Raiva","Tristeza","Nojo","Frustração","Apatia","Vergonha","Ressentimento","Inveja","Carência","Esperança","Alívio","Amor","Paixão","Impulso","Orgulho","Solidão","Paciência"];
    
    function getEmptyDiary() {
        let emocoes = {};
        emocoesList.forEach(e => { emocoes[e] = { intensidade: 0, gatilho: "", pensamentos: "", outra_forma: "", descricao: "" }; });
        return {
            estrela: "", estrela_roteiro: "", diario_texto: "", diario_foto: null, reflexao: "",
            checklist_fisica: { banho:false, dentes:false, agua:false, comida:false, sol:false, movimento:false },
            checklist_autocuidado: { medicamentos:false, terapia:false, amorProprio:false, limites:false, ajuda:false, detox:false, skincare:false, arrumarCama:false, hobby:false },
            criseplay: { fisica: {}, sensorial: {}, emocional: {} },
            replay: { situacao: "", aceito: "", agradeco: "", nao_faz_bem: "", faz_bem: "", deixo_ir: "", desfruto: "", nao_preciso: "" },
            elogios: ["","",""], gratidao: ["","",""], sofa_preguica: "", hd_sigiloso: "",
            emocoes: emocoes,
            ikigai_respostas: {}, ikigai_data: null,
            roda_vida: {}, roda_vida_data: null,
            coadjuvantes: {},
            saga: {}
        };
    }
    
    function saveAll() { if(currentUser) localStorage.setItem('netpsi_users', JSON.stringify(users)); }
    
    function changePage(page) {
        currentPage = page;
        for(let i=0;i<pageKeys.length;i++) document.getElementById(pageKeys[i]).classList.add('hidden');
        document.getElementById(pageKeys[page]).classList.remove('hidden');
        document.querySelectorAll('.page-btn').forEach((btn,idx)=>{ if(idx==page) btn.classList.add('active'); else btn.classList.remove('active'); });
        if(page===1) renderPagina1();
        if(page===2) renderPagina2();
        if(page===3) renderPagina3();
        if(page===4) renderPagina4();
        if(page===5) renderPagina5();
        if(page===6) renderDiagnostiFlix();
        if(page===7) renderIkigaiFlix();
        if(page===8) renderArquivos();
    }
    
    // PÁGINA 0 - EPISÓDIO
    function renderPagina0() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        document.getElementById('page0').innerHTML = `
            <div class="section"><h3>EXERCÍCIO TERAPÊUTICO</h3><div class="tv-smart" id="exercicioBtn"><div class="tv-screen">CLIQUE AQUI<br>PARA SEU EXERCÍCIO</div></div><textarea id="reflexaoTexto" rows="3" placeholder="Escreva sua reflexão...">${data.reflexao||""}</textarea></div>
            <div class="section"><div class="tv-smart" id="tvSmartBtn"><div class="tv-screen">COMO FOI O EPISÓDIO DE HOJE?</div><div class="tv-stand"></div></div></div>
            <div class="section"><h3>Como está sua estrela hoje?</h3><div class="estrela-options"><div class="estrela-option ${data.estrela==='brilhando'?'selected':''}" data-estrela="brilhando">Brilhando</div><div class="estrela-option ${data.estrela==='apagada'?'selected':''}" data-estrela="apagada">Apagada</div></div><textarea id="estrelaRoteiro" placeholder="Descreva o roteiro...">${data.estrela_roteiro}</textarea></div>
            <div class="two-columns"><div class="section"><h3>Checklist Saúde Física</h3><div class="checklist-vertical"><label><input type="checkbox" id="fis_banho" ${data.checklist_fisica.banho?'checked':''}> Tomei banho</label><label><input type="checkbox" id="fis_dentes" ${data.checklist_fisica.dentes?'checked':''}> Escovei dentes</label><label><input type="checkbox" id="fis_agua" ${data.checklist_fisica.agua?'checked':''}> Bebi água</label><label><input type="checkbox" id="fis_comida" ${data.checklist_fisica.comida?'checked':''}> Comi bem</label><label><input type="checkbox" id="fis_sol" ${data.checklist_fisica.sol?'checked':''}> Tomei sol</label><label><input type="checkbox" id="fis_movimento" ${data.checklist_fisica.movimento?'checked':''}> Me movimentei</label></div></div>
            <div class="section"><h3>Checklist Autocuidado</h3><div class="checklist-vertical"><label><input type="checkbox" id="auto_med" ${data.checklist_autocuidado.medicamentos?'checked':''}> Tomei medicamentos</label><label><input type="checkbox" id="auto_ter" ${data.checklist_autocuidado.terapia?'checked':''}> Fui à terapia</label><label><input type="checkbox" id="auto_amor" ${data.checklist_autocuidado.amorProprio?'checked':''}> Pratiquei amor-próprio</label><label><input type="checkbox" id="auto_lim" ${data.checklist_autocuidado.limites?'checked':''}> Estabeleci limites</label><label><input type="checkbox" id="auto_aju" ${data.checklist_autocuidado.ajuda?'checked':''}> Pedi ajuda</label><label><input type="checkbox" id="auto_detox" ${data.checklist_autocuidado.detox?'checked':''}> Detox de tela</label><label><input type="checkbox" id="auto_skincare" ${data.checklist_autocuidado.skincare?'checked':''}> Skincare</label><label><input type="checkbox" id="auto_cama" ${data.checklist_autocuidado.arrumarCama?'checked':''}> Arrumar a cama</label><label><input type="checkbox" id="auto_hobby" ${data.checklist_autocuidado.hobby?'checked':''}> Hobby</label></div></div></div>
            <div class="two-columns"><div class="section"><h3>Elogie-se, você é uma estrela</h3><textarea id="elogio1" placeholder="Elogio 1">${data.elogios[0]}</textarea><textarea id="elogio2" placeholder="Elogio 2">${data.elogios[1]}</textarea><textarea id="elogio3" placeholder="Elogio 3">${data.elogios[2]}</textarea></div>
            <div class="section"><h3>Gratidão pelo episódio de hoje</h3><textarea id="gratidao1" placeholder="Gratidão 1">${data.gratidao[0]}</textarea><textarea id="gratidao2" placeholder="Gratidão 2">${data.gratidao[1]}</textarea><textarea id="gratidao3" placeholder="Gratidão 3">${data.gratidao[2]}</textarea></div></div>
            <div class="section"><h3>Sofá da Preguiça</h3><textarea id="sofaPreguica" placeholder="O que procrastinei hoje?">${data.sofa_preguica||""}</textarea></div>
            <div class="section"><h3>HD Sigiloso</h3><textarea id="hdSigiloso" placeholder="Uma carta para nunca ser enviada">${data.hd_sigiloso||""}</textarea></div>
        `;
        document.getElementById('exercicioBtn')?.addEventListener('click', () => {
            const exs = ["Escreva sobre um momento que você se sentiu orgulhosa", "Descreva uma situação de ansiedade e como lidou", "Escreva uma carta de perdão para si mesma"];
            alert(exs[Math.floor(Math.random() * exs.length)]);
        });
        document.getElementById('tvSmartBtn')?.addEventListener('click', () => openDiarioModal());
        document.querySelectorAll('.estrela-option').forEach(opt => {
            opt.onclick = () => { document.querySelectorAll('.estrela-option').forEach(o => o.classList.remove('selected')); opt.classList.add('selected'); };
        });
        document.querySelectorAll('#page0 input, #page0 textarea').forEach(el => {
            if(el.id && el.tagName === 'INPUT' && el.type === 'checkbox') el.addEventListener('change', () => capturePage0());
            else if(el.id && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox'))) el.addEventListener('input', () => capturePage0());
        });
    }
    
    function capturePage0() {
        if(!users[currentUser]?.diarios?.[currentDate]) return;
        let data = users[currentUser].diarios[currentDate];
        data.reflexao = document.getElementById('reflexaoTexto')?.value || "";
        data.estrela_roteiro = document.getElementById('estrelaRoteiro')?.value || "";
        let sel = document.querySelector('.estrela-option.selected');
        if(sel) data.estrela = sel.dataset.estrela;
        data.elogios = [document.getElementById('elogio1')?.value||"", document.getElementById('elogio2')?.value||"", document.getElementById('elogio3')?.value||""];
        data.gratidao = [document.getElementById('gratidao1')?.value||"", document.getElementById('gratidao2')?.value||"", document.getElementById('gratidao3')?.value||""];
        data.sofa_preguica = document.getElementById('sofaPreguica')?.value || "";
        data.hd_sigiloso = document.getElementById('hdSigiloso')?.value || "";
        data.checklist_fisica = {
            banho: !!document.getElementById('fis_banho')?.checked, dentes: !!document.getElementById('fis_dentes')?.checked,
            agua: !!document.getElementById('fis_agua')?.checked, comida: !!document.getElementById('fis_comida')?.checked,
            sol: !!document.getElementById('fis_sol')?.checked, movimento: !!document.getElementById('fis_movimento')?.checked
        };
        data.checklist_autocuidado = {
            medicamentos: !!document.getElementById('auto_med')?.checked, terapia: !!document.getElementById('auto_ter')?.checked,
            amorProprio: !!document.getElementById('auto_amor')?.checked, limites: !!document.getElementById('auto_lim')?.checked,
            ajuda: !!document.getElementById('auto_aju')?.checked, detox: !!document.getElementById('auto_detox')?.checked,
            skincare: !!document.getElementById('auto_skincare')?.checked, arrumarCama: !!document.getElementById('auto_cama')?.checked,
            hobby: !!document.getElementById('auto_hobby')?.checked
        };

        16: "Sua relação com telas, redes sociais e dispositivos. Se o uso é consciente.",
        17: "Seus cuidados pessoais e com o ambiente. Como forma de respeito consigo mesmo(a).",
        18: "Sua relação com o próprio corpo, desejo e expressão sexual.",
        19: "Sua capacidade de transformar intenção em ação. Se você realiza o que planeja."
    };
    
    function renderDiagnostiFlix() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let roda = data.roda_vida || {};
        let pode = (!data.roda_vida_data || new Date(data.roda_vida_data).getMonth() !== new Date().getMonth());
        if(!pode) { document.getElementById('page6').innerHTML = `<div class="blocked-message">Você já avaliou sua vida este mês. Volte no mês que vem.</div>`; return; }
        
        let html = `<div class="section"><h3>Avalie sua vida</h3><p class="text-small" style="margin-bottom:1rem;">Esta avaliação pode ser feita a cada 2 meses.</p>`;
        for(let i=0;i<areasDiagnostiFlix.length;i++) {
            let nota = roda[i] || 5;
            let corClass = nota <= 3 ? 'critico' : nota <= 5 ? 'atencao' : nota <= 7 ? 'regular' : 'bom';
            html += `<div class="info-card" style="margin-bottom:1rem;">
                <h4>${areasDiagnostiFlix[i]}</h4>
                <p class="text-small">${descricoesAreas[i] || ""}</p>
                <div><span>Nota: <span id="nota_val_${i}">${nota}</span>/10</span></div>
                <div class="progress-bar-bg"><div class="progress-fill ${corClass}" id="progress_${i}" style="width:${nota*10}%"></div></div>
                <input type="range" id="roda_${i}" min="0" max="10" value="${nota}" style="width:100%;">
                <div id="perguntas_container_${i}" style="margin-top:0.8rem;"></div>
            </div>`;
        }
        html += `<button class="btn-red" id="salvarRodaBtn" style="margin-top:0.5rem;">Salvar avaliação</button></div>`;
        document.getElementById('page6').innerHTML = html;
        
        for(let i=0;i<areasDiagnostiFlix.length;i++) {
            let slider = document.getElementById(`roda_${i}`);
            if(slider) {
                slider.addEventListener('input', (e) => {
                    let val = parseInt(e.target.value);
                    document.getElementById(`nota_val_${i}`).innerText = val;
                    let classe = val <= 3 ? 'critico' : val <= 5 ? 'atencao' : val <= 7 ? 'regular' : 'bom';
                    let progress = document.getElementById(`progress_${i}`);
                    if(progress) { progress.style.width = (val*10)+'%'; progress.className = 'progress-fill '+classe; }
                    let data = users[currentUser].diarios[currentDate];
                    if(data && data.roda_vida) data.roda_vida[i] = val;
                });
            }
            renderPerguntasArea(i, roda);
        }
        
        document.getElementById('salvarRodaBtn')?.addEventListener('click', () => {
            let novaRoda = {};
            for(let i=0;i<areasDiagnostiFlix.length;i++) {
                novaRoda[i] = parseInt(document.getElementById(`roda_${i}`)?.value) || 5;
                for(let j=0;j<perguntasAreas[i].length;j++) {
                    let resp = document.getElementById(`resp_${i}_${j}`);
                    if(resp) novaRoda[`resp_${i}_${j}`] = resp.value;
                }
            }
            if(users[currentUser].diarios[currentDate]) {
                users[currentUser].diarios[currentDate].roda_vida = novaRoda;
                users[currentUser].diarios[currentDate].roda_vida_data = new Date().toISOString();
                saveAll(); alert("Avaliação salva! Volte daqui a 2 meses."); renderDiagnostiFlix();
            }
        });
    }
    
    const perguntasAreas = {
        0: [{ pergunta: "Sinto que meu trabalho tem sentido?", sugestoes: ["Me sinto perdida", "Gosto do que faço", "Quero mudar de área", "Não me sinto reconhecida", "Sinto propósito no meu trabalho"] }],
        1: [{ pergunta: "Me sinto amada e respeitada?", sugestoes: ["Me sinto sozinha", "Existe carinho", "Falta diálogo", "Tenho medo", "Me sinto acolhida"] }],
        2: [{ pergunta: "Tenho amigos com quem posso contar?", sugestoes: ["Me sinto apoiada", "Estou sozinha", "Quero fazer mais amigos", "Me sinto acolhida"] }]
    };
    for(let i=3;i<20;i++) { perguntasAreas[i] = [{ pergunta: "Como você avalia esta área?", sugestoes: ["Precisa melhorar", "Estou satisfeita", "Quero mudar"] }]; }
    
    function renderPerguntasArea(idx, roda) {
        let container = document.getElementById(`perguntas_container_${idx}`);
        if(!container) return;
        let perguntas = perguntasAreas[idx] || [{ pergunta: "Como você avalia esta área?", sugestoes: ["Precisa melhorar", "Estou satisfeita", "Quero mudar"] }];
        let html = '';
        for(let j=0;j<perguntas.length;j++) {
            let respAtual = roda[`resp_${idx}_${j}`] || "";
            html += `<div class="pergunta-card"><div class="pergunta-header" data-pergunta="${idx}_${j}"><h4>Cena desbloqueada: ${perguntas[j].pergunta}</h4><span>+</span></div>
                <div class="pergunta-content" id="pergunta_content_${idx}_${j}"><textarea id="resp_${idx}_${j}" placeholder="Escreva sua reflexão..." rows="2">${respAtual}</textarea>
                <div class="sugestoes-chips">${perguntas[j].sugestoes.map(s => `<div class="chip" data-target="resp_${idx}_${j}" data-texto="${s}">${s}</div>`).join('')}</div></div></div>`;
        }
        container.innerHTML = html;
        for(let j=0;j<perguntas.length;j++) {
            let header = document.querySelector(`.pergunta-header[data-pergunta="${idx}_${j}"]`);
            if(header) header.onclick = () => { let c=document.getElementById(`pergunta_content_${idx}_${j}`); c.classList.toggle('open'); let icon=header.querySelector('span'); icon.innerText=c.classList.contains('open')?'-':'+'; };
            document.querySelectorAll(`.chip[data-target="resp_${idx}_${j}"]`).forEach(chip => { chip.onclick = () => { let ta=document.getElementById(chip.dataset.target); if(ta) ta.value = (ta.value ? ta.value + " " : "") + chip.dataset.texto; }; });
            let textarea = document.getElementById(`resp_${idx}_${j}`);
            if(textarea) textarea.addEventListener('input', () => { let d=users[currentUser].diarios[currentDate]; if(d && d.roda_vida) d.roda_vida[`resp_${idx}_${j}`]=textarea.value; saveAll(); });
        }
    }
    
    // PÁGINA 7 - IKIGAI FLIX
    function renderIkigaiFlix() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let pode = (!data.ikigai_data || (new Date() - new Date(data.ikigai_data) > 60*24*60*60*1000));
        if(!pode) { document.getElementById('page7').innerHTML = `<div class="blocked-message">Você já fez seu IKIGAI neste bimestre. Volte daqui a 2 meses.</div>`; return; }
        let resp = data.ikigai_respostas || {};
        
        let html = `<div class="section"><h3>Seu Ikigai (Razão de Ser)</h3>
            <p class="text-small" style="margin-bottom:0.5rem;">Seu propósito não nasce de uma única resposta. Ele aparece no encontro entre partes da sua vida.</p>
            <div class="info-card"><h4>O que é IKIGAI?</h4><p class="text-small">O IKIGAI é um método japonês de autoconhecimento que ajuda você a entender: o que ama, no que é boa, o que o mundo precisa e o que pode gerar retorno financeiro. Seu propósito geralmente nasce no cruzamento dessas áreas.</p></div>
            
            <div class="ikigai-circles"><div class="ikigai-row"><div class="ikigai-sphere"><div class="ikigai-title">Aquilo que você ama</div><div class="circle-btn" data-tipo="pergunta" data-area="ama">?</div><div class="circle-btn" data-tipo="resposta" data-area="ama">R</div></div></div>
            <div class="ikigai-row"><div class="ikigai-sphere"><div class="ikigai-title">No que você é boa</div><div class="circle-btn" data-tipo="pergunta" data-area="boa">?</div><div class="circle-btn" data-tipo="resposta" data-area="boa">R</div></div>
            <div class="ikigai-sphere"><div class="ikigai-title">O que o mundo precisa</div><div class="circle-btn" data-tipo="pergunta" data-area="mundo">?</div><div class="circle-btn" data-tipo="resposta" data-area="mundo">R</div></div></div>
            <div class="ikigai-row"><div class="ikigai-sphere"><div class="ikigai-title">Pelo que você pode ser paga</div><div class="circle-btn" data-tipo="pergunta" data-area="paga">?</div><div class="circle-btn" data-tipo="resposta" data-area="paga">R</div></div></div></div>`;
        
        const secoes = [
            { id: "ama", titulo: "O QUE VOCÊ AMA", explicacao: "São atividades, assuntos ou experiências que fazem você se sentir viva emocionalmente.",
              perguntas: ["O que me faz sentir viva?", "O que eu faria de graça?", "O que me empolga naturalmente?"],
              sugestoes: ["Psicologia", "Música", "Ajudar pessoas", "Escrever", "Arte", "Crianças", "Ensinar", "Saúde mental", "Criatividade", "Comunicação"] },
            { id: "boa", titulo: "NO QUE VOCÊ É BOA", explicacao: "São habilidades naturais ou desenvolvidas que você executa bem.",
              perguntas: ["Pelo que as pessoas me procuram?", "O que faço com facilidade?", "Em quais áreas me destaco?"],
              sugestoes: ["Escutar", "Organizar", "Cuidar", "Comunicar", "Criar", "Liderar", "Ensinar", "Resolver problemas", "Acolher", "Escrever"] },
            { id: "mundo", titulo: "O QUE O MUNDO PRECISA", explicacao: "São problemas, necessidades ou dores que despertam sua vontade de contribuir.",
              perguntas: ["Que problemas me tocam emocionalmente?", "Como quero ajudar pessoas?", "Que impacto quero deixar?"],
              sugestoes: ["Saúde mental", "Educação", "Inclusão", "Amor", "Escuta", "Segurança emocional", "Autoconhecimento", "Crianças", "Fé", "Relações saudáveis"] },
            { id: "paga", titulo: "PELO QUE VOCÊ PODE SER PAGA", explicacao: "São habilidades, conhecimentos ou serviços que possuem valor profissional.",
              perguntas: ["Pelo que as pessoas pagariam?", "O que posso transformar em profissão?", "Que habilidade minha gera valor?"],
              sugestoes: ["Atendimento psicológico", "Escrita", "Redes sociais", "Aulas", "Arte", "Consultoria", "Comunicação", "Música", "Terapia", "Criação de conteúdo"] }
        ];
        
        for(let s of secoes) {
            html += `<div class="ikigai-section"><h4>${s.titulo}</h4><p class="ikigai-explicacao">${s.explicacao}</p>
                <div class="perguntas-container">${s.perguntas.map(p => `<div class="pergunta-card"><div class="pergunta-header" data-area="${s.id}" data-pergunta="${p}"><span>${p}</span><span>+</span></div>
                <div class="pergunta-content" id="pergunta_${s.id}_${p.replace(/ /g,'_')}"><textarea id="resp_${s.id}_${p.replace(/ /g,'_')}" rows="2" placeholder="Escreva sua resposta...">${resp[`${s.id}_${p}`]||""}</textarea>
                <div class="sugestoes-chips">${s.sugestoes.map(sug => `<div class="chip" data-target="resp_${s.id}_${p.replace(/ /g,'_')}" data-texto="${sug}">${sug}</div>`).join('')}</div></div></div>`).join('')}</div></div>`;
        }
        
        html += `<div class="info-card"><h4>INTERSEÇÕES DO IKIGAI</h4><p class="text-small">É o ponto de encontro entre as áreas. Representa seu propósito em construção.</p>
            <div class="pergunta-card"><div class="pergunta-header" data-area="paixao"><h4>PAIXÃO</h4><span>+</span></div><div class="pergunta-content" id="pergunta_paixao"><p class="text-small">Paixão = o que você ama + o que você é boa</p><textarea id="resp_paixao" rows="2" placeholder="Escreva sua reflexão...">${resp.paixao||""}</textarea></div></div>
            <div class="pergunta-card"><div class="pergunta-header" data-area="vocacao"><h4>VOCAÇÃO</h4><span>+</span></div><div class="pergunta-content" id="pergunta_vocacao"><p class="text-small">Vocação = o que você é boa + o que você pode ser paga</p><textarea id="resp_vocacao" rows="2" placeholder="Escreva sua reflexão...">${resp.vocacao||""}</textarea></div></div>
            <div class="pergunta-card"><div class="pergunta-header" data-area="missao"><h4>MISSÃO</h4><span>+</span></div><div class="pergunta-content" id="pergunta_missao"><p class="text-small">Missão = o que o mundo precisa + o que você ama</p><textarea id="resp_missao" rows="2" placeholder="Escreva sua reflexão...">${resp.missao||""}</textarea></div></div>
            <div class="pergunta-card"><div class="pergunta-header" data-area="profissao"><h4>PROFISSÃO</h4><span>+</span></div><div class="pergunta-content" id="pergunta_profissao"><p class="text-small">Profissão = o que você pode ser paga + o que o mundo precisa</p><textarea id="resp_profissao" rows="2" placeholder="Escreva sua reflexão...">${resp.profissao||""}</textarea></div></div></div>`;
        
        html += `<div class="resultado-ikigai" style="background:#2a2a2a;padding:1rem;border-radius:12px;margin-top:1rem;"><h4>RESULTADO FINAL</h4><p class="text-small" style="margin-bottom:0.5rem;">Seu IKIGAI pode estar relacionado a...</p><textarea id="ikigai_resultado" rows="3" placeholder="O sistema cruzará seus padrões automaticamente. Escreva sua conclusão aqui...">${resp.resultado||""}</textarea>
            <p class="text-small" style="margin-top:0.5rem;">O propósito não precisa nascer pronto. Ele costuma aparecer quando você percebe os padrões do que ama, faz bem, oferece ao mundo e consegue sustentar.</p></div>
            <div class="camera-box"><div style="background:#0a0a0a;width:50px;height:50px;border-radius:50%;margin:0 auto 0.5rem;display:flex;align-items:center;justify-content:center;border:2px solid #E50914;">CAM</div><h4>Meu IKIGAI</h4><textarea id="ikigai_final" rows="3" placeholder="Escreva sua conclusão final...">${resp.final||""}</textarea></div>
            <button class="btn-red" id="salvarIkigaiBtn">Salvar IKIGAI</button></div>`;
        document.getElementById('page7').innerHTML = html;
        
        // Configurar expansão das perguntas
        document.querySelectorAll('.pergunta-header').forEach(header => {
            header.onclick = () => {
                let content = header.parentElement.querySelector('.pergunta-content');
                if(content) {
                    content.classList.toggle('open');
                    let icon = header.querySelectorAll('span')[1];
                    if(icon) icon.innerText = content.classList.contains('open') ? '-' : '+';
                }
            };
        });
        
        // Configurar chips
        document.querySelectorAll('.chip[data-target]').forEach(chip => {
            chip.onclick = () => {
                let ta = document.getElementById(chip.dataset.target);
                if(ta) ta.value = (ta.value ? ta.value + " " : "") + chip.dataset.texto;
            };
        });
        
        // Salvar respostas
        const salvarResposta = (id, campo) => {
            let el = document.getElementById(id);
            if(el) el.addEventListener('input', () => {
                let d = users[currentUser].diarios[currentDate];
                if(d) { if(!d.ikigai_respostas) d.ikigai_respostas = {}; d.ikigai_respostas[campo] = el.value; saveAll(); }
            });
        };
        
        for(let s of secoes) {
            for(let p of s.perguntas) {
                salvarResposta(`resp_${s.id}_${p.replace(/ /g,'_')}`, `${s.id}_${p}`);
            }
        }
        salvarResposta('resp_paixao', 'paixao');
        salvarResposta('resp_vocacao', 'vocacao');
        salvarResposta('resp_missao', 'missao');
        salvarResposta('resp_profissao', 'profissao');
        salvarResposta('ikigai_resultado', 'resultado');
        salvarResposta('ikigai_final', 'final');
        
        document.getElementById('salvarIkigaiBtn')?.addEventListener('click', () => {
            if(users[currentUser].diarios[currentDate]) {
                users[currentUser].diarios[currentDate].ikigai_data = new Date().toISOString();
                saveAll(); alert("IKIGAI salvo! Próxima jornada em 2 meses."); renderIkigaiFlix();
            }
        });
        
        document.querySelectorAll('.circle-btn').forEach(btn => {
            btn.onclick = () => {
                let tipo = btn.dataset.tipo, area = btn.dataset.area;
                if(tipo === 'pergunta') {
                    let perg = { ama: "O que você ama fazer?", boa: "Quais seus talentos?", mundo: "O que o mundo precisa?", paga: "Pelo que podem te pagar?" };
                    alert(`Reflexão: ${perg[area] || "Pense sobre esta área"}`);
                } else {
                    let modal = document.createElement('div'); modal.className='modal';
                    modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3>Minha resposta</h3><span class="close-modal">&times;</span></div><textarea id="modalResp" rows="4" placeholder="Escreva sua resposta..."></textarea><button class="btn-red" id="saveModalResp">Salvar</button></div>`;
                    document.body.appendChild(modal); modal.style.display='flex';
                    modal.querySelector('.close-modal').onclick = () => modal.remove();
                    document.getElementById('saveModalResp').onclick = () => {
                        let d = users[currentUser].diarios[currentDate];
                        if(d) { if(!d.ikigai_respostas) d.ikigai_respostas = {}; d.ikigai_respostas[area] = document.getElementById('modalResp').value; saveAll(); }
                        modal.remove();
                    };
                }
            };
        });
    }
    
    // PÁGINA 8 - ARQUIVO X
    function renderArquivos() {
        let diarios = users[currentUser]?.diarios || {};
        let dates = Object.keys(diarios).sort().reverse();
        let html = `<div class="vhs-container">`;
        dates.forEach(d => { html += `<div class="vhs-card" data-data="${d}"><div class="vhs-date">${d}</div><div class="vhs-info">Episódio salvo</div></div>`; });
        html += `</div>`;
        document.getElementById('page8').innerHTML = html;
        document.querySelectorAll('.vhs-card').forEach(c => { c.onclick = () => { currentDate = c.dataset.data; loadDate(); changePage(0); }; });
    }
    
    function loadDate() {
        if(!users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate] = getEmptyDiary();
        renderPagina0();
        renderPagina1();
        renderPagina2();
        renderPagina3();
        renderPagina4();
        renderPagina5();
        if(currentPage===6) renderDiagnostiFlix();
        if(currentPage===7) renderIkigaiFlix();
        if(currentPage===8) renderArquivos();
        updateHistorySelect();
    }
    
    function updateHistorySelect() {
        let select = document.getElementById('historySelect');
        if(!select) return;
        let dates = Object.keys(users[currentUser].diarios || {}).sort().reverse();
        select.innerHTML = '<option value="hoje">Hoje</option>';
        dates.forEach(d => { if(d !== new Date().toISOString().slice(0,10)) select.innerHTML += `<option value="${d}">${d}</option>`; });
        select.value = currentDate === new Date().toISOString().slice(0,10) ? "hoje" : currentDate;
    }
    
    function initDashboard() {
        let today = new Date().toISOString().slice(0,10);
        if(!users[currentUser].diarios) users[currentUser].diarios = {};
        if(!users[currentUser].diarios[today]) users[currentUser].diarios[today] = getEmptyDiary();
        currentDate = today;
        loadDate();
        document.getElementById('currentUserDisplay').innerText = currentUser;
        document.getElementById('avatarBtn').innerText = currentUser.charAt(0).toUpperCase();
        document.getElementById('saveEntryBtn').onclick = () => { capturePage0(); alert("Episódio salvo!"); };
        document.getElementById('historySelect').onchange = (e) => { let val = e.target.value === "hoje" ? new Date().toISOString().slice(0,10) : e.target.value; capturePage0(); currentDate = val; loadDate(); };
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; document.getElementById('dashboard').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; };
        let nav = document.getElementById('pageNav');
        nav.innerHTML = pageNames.map((n,i) => `<button class="page-btn ${i===0?'active':''}" data-page="${i}">${n}</button>`).join('');
        document.querySelectorAll('.page-btn').forEach(btn => { btn.onclick = () => { capturePage0(); changePage(parseInt(btn.dataset.page)); }; });
        changePage(0);
    }
    
    // LOGIN COM TECLA ENTER
    let isLoginMode = true;
    function handleLogin() {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        if(!user || !pass) { document.getElementById('loginError').innerText = "Preencha usuário e senha."; return; }
        if(isLoginMode) {
            if(users[user] && users[user].senha === pass) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            } else { document.getElementById('loginError').innerText = "Usuário ou senha incorretos."; }
        } else {
            if(users[user]) { document.getElementById('loginError').innerText = "Usuário já existe."; }
            else {
                users[user] = { senha: pass, diarios: {} };
                localStorage.setItem('netpsi_users', JSON.stringify(users));
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            }
        }
    }
    
    document.getElementById('submitBtn').onclick = handleLogin;
    document.getElementById('loginPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('loginUser').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    
    document.getElementById('switchBtn').onclick = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('formTitle').innerText = isLoginMode ? "Entrar na sua temporada" : "Criar sua temporada";
        document.getElementById('submitBtn').innerText = isLoginMode ? "Entrar" : "Criar conta";
        document.getElementById('switchBtn').innerText = isLoginMode ? "Criar sua temporada" : "Já tenho conta";
        document.getElementById('loginError').innerText = "";
    };
</script>
</body>
</html>
