<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NETPSI - Seu Diário Terapêutico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #141414; color: #e5e5e5; font-family: Arial, sans-serif; }
        .login-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; }
        .netpsi-logo { font-size: 3.5rem; font-weight: 900; color: #E50914; text-align: center; }
        .tagline { font-size: 1rem; color: #ccc; text-align: center; }
        .producer { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 2rem; }
        .login-card { background: rgba(0,0,0,0.8); border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 350px; }
        .login-card h2 { margin-bottom: 1rem; font-size: 1.4rem; color: white; }
        .input-group { margin-bottom: 1rem; }
        .input-group input { width: 100%; padding: 0.8rem; background: #333; border: none; border-radius: 8px; color: white; font-size: 1rem; }
        .btn-red { background: #E50914; color: white; border: none; padding: 0.8rem; font-size: 1rem; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 0.5rem; }
        .switch-btn { background: none; border: none; color: #b3b3b3; margin-top: 1rem; cursor: pointer; width: 100%; }
        .login-footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #666; font-style: italic; }
        .dashboard { display: none; }
        .nav-bar { background: #000; padding: 0.8rem; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .nav-logo { font-size: 1.5rem; font-weight: bold; color: #E50914; }
        .page-nav { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .page-btn { background: #333; border: none; color: white; padding: 0.3rem 0.6rem; cursor: pointer; border-radius: 20px; font-size: 0.7rem; }
        .page-btn.active { background: #E50914; }
        .user-info { display: flex; align-items: center; gap: 0.5rem; }
        .avatar { width: 35px; height: 35px; background: black; border: 2px solid #E50914; display: flex; align-items: center; justify-content: center; color: #E50914; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-logout { background: #E50914; border: none; color: white; padding: 0.3rem 0.6rem; border-radius: 20px; cursor: pointer; }
        .save-bar { background: #1f1f1f; padding: 0.5rem; display: flex; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1rem; }
        .btn-save { background: #E50914; border: none; color: white; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; }
        .history-select { background: #333; color: white; padding: 0.3rem; border-radius: 20px; border: none; }
        .page-container { max-width: 1000px; margin: 1rem auto; padding: 0 1rem; }
        .section { background: #1f1f1f; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #E50914; }
        .section h3 { color: #E50914; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .hidden { display: none; }
        .two-columns { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem; }
        @media (min-width: 768px) { .two-columns { grid-template-columns: 1fr 1fr; } }
        input, textarea { background: #2a2a2a; border: none; padding: 0.5rem; color: white; border-radius: 8px; width: 100%; margin-bottom: 0.5rem; }
        .streak-card { background: #2a2a2a; border-radius: 20px; padding: 0.5rem; text-align: center; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border: 2px solid #FFD700; }
        .streak-number { font-size: 1.5rem; font-weight: bold; color: #E50914; }
        .tv-smart { background: #2a2a2a; border-radius: 20px; padding: 0.8rem; text-align: center; cursor: pointer; border: 1px solid #E50914; margin-bottom: 0.5rem; }
        .tv-screen { background: #0a0a0a; border-radius: 12px; padding: 0.5rem; font-size: 1rem; }
        .checklist-vertical { display: flex; flex-direction: column; gap: 0.3rem; }
        .estrela-options { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
        .estrela-option { background: #2a2a2a; padding: 0.3rem 0.8rem; border-radius: 30px; cursor: pointer; font-size: 0.8rem; }
        .estrela-option.selected { background: #E50914; }
        .info-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; margin-bottom: 0.8rem; }
        .text-small { font-size: 0.7rem; color: #aaa; }
        .check-group-vertical { display: flex; flex-direction: column; gap: 0.3rem; }
        .esferas-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
        @media (min-width: 768px) { .esferas-grid { grid-template-columns: repeat(2, 1fr); } }
        .esfera-card { background: #1f1f1f; border-radius: 12px; padding: 0.8rem; border-left: 4px solid #E50914; margin-bottom: 0.8rem; }
        .esfera-desc { font-size: 0.7rem; color: #aaa; cursor: pointer; margin-bottom: 0.3rem; }
        .desc-full { display: none; font-size: 0.65rem; color: #ccc; background: #2a2a2a; padding: 0.3rem; border-radius: 8px; margin-bottom: 0.3rem; }
        .desc-full.open { display: block; }
        .hormonios-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
        @media (min-width: 768px) { .hormonios-grid { grid-template-columns: repeat(2, 1fr); } }
        .hormonio-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; }
        .nota-botao { background: #333; border: 1px solid #E50914; color: #E50914; padding: 0.2rem 0.5rem; border-radius: 20px; cursor: pointer; font-size: 0.7rem; display: inline-block; margin-right: 0.3rem; }
        .diagnost-card { background: #1f1f1f; border-radius: 12px; padding: 0.8rem; margin-bottom: 0.8rem; }
        .emo-acordeon { margin-bottom: 0.5rem; }
        .emo-header { background: #2a2a2a; padding: 0.5rem; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; }
        .emo-header h4 { color: #4CAF50; font-size: 0.9rem; }
        .emo-content { display: none; padding: 0.5rem; background: #252525; border-radius: 8px; margin-top: 0.3rem; }
        .emo-content.open { display: block; }
        .emo-question { margin-bottom: 0.5rem; }
        .emo-question label { font-size: 0.65rem; color: #aaa; display: block; }
        input[type="range"] { width: 100%; margin: 0.3rem 0; }
        .vhs-container { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
        @media (min-width: 500px) { .vhs-container { grid-template-columns: 1fr 1fr; } }
        .vhs-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-radius: 12px; padding: 0.8rem; border: 1px solid #E50914; cursor: pointer; margin-bottom: 0.5rem; }
        .vhs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
        .vhs-date { font-size: 0.8rem; font-weight: bold; color: #E50914; }
        .vhs-content { display: none; margin-top: 0.5rem; }
        .vhs-content.open { display: block; }
        .vhs-content-item { background: #1a1a1a; padding: 0.3rem; border-radius: 6px; margin-bottom: 0.3rem; font-size: 0.7rem; }
        .edit-vhs, .delete-vhs, .save-vhs { background: #E50914; color: white; border: none; padding: 0.2rem 0.5rem; border-radius: 20px; cursor: pointer; font-size: 0.6rem; margin-right: 0.3rem; }
        .blocked-message { text-align: center; padding: 1rem; background: #1f1f1f; border-radius: 12px; color: #E50914; font-size: 0.8rem; }
        .modal-full { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: #1f1f1f; border-radius: 16px; width: 90%; max-width: 500px; padding: 1rem; border-left: 4px solid #E50914; }
        .close-modal { cursor: pointer; font-size: 1.5rem; float: right; color: #E50914; }
        .ikigai-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin: 1rem 0; }
        @media (min-width: 768px) { .ikigai-grid { grid-template-columns: repeat(2, 1fr); } }
        .ikigai-card { background: #1f1f1f; border: 1px solid #E50914; border-radius: 12px; padding: 0.8rem; }
        .ikigai-card h4 { color: #E50914; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .intersecao-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin: 1rem 0; }
        @media (min-width: 768px) { .intersecao-grid { grid-template-columns: repeat(2, 1fr); } }
        .intersecao-card { background: #2a2a2a; padding: 0.8rem; border-radius: 12px; cursor: pointer; }
        .intersecao-card h4 { color: #E50914; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .intersecao-card .resultado-texto { font-size: 0.7rem; color: #ccc; margin-top: 0.3rem; display: none; }
        .btn-outline { background: transparent; border: 1px solid #E50914; color: #E50914; padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; margin-top: 0.5rem; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <div class="netpsi-logo">NETPSI</div>
    <div class="tagline">Seu diário terapêutico pessoal</div>
    <div class="producer">Uma produção de Rute Kautscher</div>
    <div class="login-card">
        <h2 id="formTitle">Entrar na sua temporada</h2>
        <div class="input-group"><input type="text" id="loginUser" placeholder="Seu usuário"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Senha"></div>
        <button class="btn-red" id="submitBtn">Entrar</button>
        <button class="switch-btn" id="switchBtn">Criar sua temporada</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div class="login-footer">Dados sigilosos, aqui ninguém assiste sua série, suas emoções são apenas suas.</div>
</div>

<div id="dashboard" class="dashboard">
    <div class="nav-bar">
        <div class="nav-logo">NETPSI</div>
        <div class="page-nav" id="pageNav"></div>
        <div class="user-info">
            <div class="avatar" id="avatarBtn">N</div>
            <div id="avatarMenu" class="avatar-menu">
                <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
                <button id="uploadAvatarBtn">Trocar Foto</button>
                <button id="removeAvatarBtn">Remover Foto</button>
            </div>
            <span id="currentUserDisplay"></span>
            <button class="btn-logout" id="logoutBtn">Sair</button>
        </div>
    </div>
    <div class="save-bar">
        <button class="btn-save" id="saveEntryBtn">Salvar episódio</button>
        <select id="historySelect" class="history-select"><option value="hoje">Hoje</option></select>
    </div>
    <div id="page0" class="page-container"></div>
    <div id="page1" class="page-container hidden"></div>
    <div id="page2" class="page-container hidden"></div>
    <div id="page3" class="page-container hidden"></div>
    <div id="page4" class="page-container hidden"></div>
    <div id="page5" class="page-container hidden"></div>
    <div id="page6" class="page-container hidden"></div>
    <div id="page7" class="page-container hidden"></div>
    <div id="page8" class="page-container hidden"></div>
    <div id="page9" class="page-container hidden"></div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('netpsi_users')) || {};
    let currentUser = null;
    let currentDate = new Date().toISOString().slice(0,10);
    let currentPage = 0;
    
    const pageNames = ["EPISÓDIO", "CINEMOÇÕES", "AÇÃO", "CRISEPLAY", "REPLAY", "NEUROFLIX", "COADJUVANTES", "DIAGNOSTIFLIX", "IKIGAI", "ARQUIVO X"];
    const pageKeys = ['page0','page1','page2','page3','page4','page5','page6','page7','page8','page9'];
    
    const emocoesList = ["Alegria","Tédio","Medo","Raiva","Tristeza","Nojo","Frustração","Apatia","Vergonha","Ressentimento","Inveja","Carência","Esperança","Alívio","Amor","Paixão","Impulso","Orgulho","Solidão","Paciência"];
    
    function calcularStreak() {
        if(!currentUser || !users[currentUser].diarios) return 0;
        let dates = Object.keys(users[currentUser].diarios).sort();
        let streak = 0;
        for(let i=dates.length-1; i>=0; i--) {
            let diff = (new Date() - new Date(dates[i])) / (1000*60*60*24);
            if(diff <= 1 && users[currentUser].diarios[dates[i]].salvo) streak++;
            else break;
        }
        return streak;
    }
    
    function getEmptyDiary() {
        let emocoes = {};
        emocoesList.forEach(e => { emocoes[e] = { intensidade: 0, gatilho: "", pensamentos: "", outra_forma: "", descricao: "" }; });
        return {
            salvo: false, estrela: "", estrela_roteiro: "", diario_texto: "", reflexao: "",
            checklist_fisica: { banho:false, dentes:false, agua:false, comida:false, sol:false, movimento:false },
            checklist_autocuidado: { medicamentos:false, terapia:false, amorProprio:false, limites:false, ajuda:false, detox:false, skincare:false, arrumarCama:false, hobby:false },
            replay: { situacao: "", aceito: "", agradeco: "", nao_faz_bem: "", faz_bem: "", deixo_ir: "", desfruto: "", nao_preciso: "" },
            criseplay: { fisica: {}, sensorial: {}, emocional: {} },
            emocoes: emocoes,
            ikigai: { respostas: { ama: "", boa: "", mundo: "", paga: "" } },
            ikigai_data: null,
            roda_vida: {}, coadjuvantes: {}, 
            saga: { dop1:false,dop2:false,dop3:false,dop4:false,dop5:false,dop6:false,dop7:false, oci1:false,oci2:false,oci3:false,oci4:false,oci5:false,oci6:false,oci7:false, end1:false,end2:false,end3:false,end4:false,end5:false,end6:false,end7:false, ser1:false,ser2:false,ser3:false,ser4:false,ser5:false,ser6:false,ser7:false }
        };
    }
    
    function saveAll() { if(currentUser) localStorage.setItem('netpsi_users', JSON.stringify(users)); }
    
    function changePage(page) {
        currentPage = page;
        for(let i=0;i<pageKeys.length;i++) document.getElementById(pageKeys[i]).classList.add('hidden');
        document.getElementById(pageKeys[page]).classList.remove('hidden');
        let btns = document.querySelectorAll('.page-btn');
        for(let i=0;i<btns.length;i++) { if(i==page) btns[i].classList.add('active'); else btns[i].classList.remove('active'); }
        if(page===0) renderPagina0();
        if(page===1) renderPagina1();
        if(page===2) renderPagina2();
        if(page===3) renderPagina3();
        if(page===4) renderPagina4();
        if(page===5) renderPagina5();
        if(page===6) renderPagina6();
        if(page===7) renderPagina7();
        if(page===8) renderIkigai();
        if(page===9) renderArquivos();
    }
    
    function openDiarioModal() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let modal = document.createElement('div'); modal.className='modal-full';
        modal.innerHTML = `<div class="modal-content"><span class="close-modal">&times;</span><h3>Como foi o episódio de hoje?</h3><textarea id="modalDiarioText" rows="6" placeholder="Escreva...">${data.diario_texto||""}</textarea><button class="btn-red" id="saveModalBtn">Salvar</button></div>`;
        document.body.appendChild(modal); modal.style.display='flex';
        modal.querySelector('.close-modal').onclick = () => modal.remove();
        document.getElementById('saveModalBtn').onclick = () => {
            if(users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate].diario_texto = document.getElementById('modalDiarioText').value;
            saveAll(); modal.remove();
        };
    }
    
    function renderPagina0() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let streak = calcularStreak();
        document.getElementById('page0').innerHTML = `
            <div class="streak-card"><div>🏆</div><div class="streak-number">${streak}</div><div>Oscar da Constância</div></div>
            <div class="section"><h3>EXERCÍCIO TERAPÊUTICO</h3><div class="tv-smart" id="exercicioBtn"><div class="tv-screen">CLIQUE AQUI</div></div><div id="exercicioTexto" style="background:#2a2a2a; padding:0.5rem; border-radius:8px; display:none; margin-top:0.5rem;"></div><textarea id="reflexaoTexto" placeholder="Sua reflexão...">${data.reflexao||""}</textarea></div>
            <div class="section"><div class="tv-smart" id="tvSmartBtn"><div class="tv-screen">COMO FOI O EPISÓDIO DE HOJE?</div></div></div>
            <div class="section"><h3>Como está sua estrela hoje?</h3><div class="estrela-options"><div class="estrela-option" data-estrela="brilhando">Brilhando</div><div class="estrela-option" data-estrela="apagada">Apagada</div></div><textarea id="estrelaRoteiro" placeholder="Descreva...">${data.estrela_roteiro}</textarea></div>
            <div class="two-columns"><div class="section"><h3>Saúde Física</h3><div class="checklist-vertical"><label><input type="checkbox" id="fis_banho"> Tomei banho</label><label><input type="checkbox" id="fis_dentes"> Escovei dentes</label><label><input type="checkbox" id="fis_agua"> Bebi água</label><label><input type="checkbox" id="fis_comida"> Comi bem</label><label><input type="checkbox" id="fis_sol"> Tomei sol</label><label><input type="checkbox" id="fis_movimento"> Me movimentei</label></div></div>
            <div class="section"><h3>Autocuidado</h3><div class="checklist-vertical"><label><input type="checkbox" id="auto_med"> Medicamentos</label><label><input type="checkbox" id="auto_ter"> Terapia</label><label><input type="checkbox" id="auto_amor"> Amor-próprio</label><label><input type="checkbox" id="auto_lim"> Limites</label><label><input type="checkbox" id="auto_aju"> Ajuda</label><label><input type="checkbox" id="auto_detox"> Detox</label><label><input type="checkbox" id="auto_skincare"> Skincare</label></div></div></div>
            <div class="two-columns"><div class="section"><h3>Elogie-se</h3><textarea id="elogio1" placeholder="Elogio 1">${data.elogios?.[0]||""}</textarea><textarea id="elogio2" placeholder="Elogio 2">${data.elogios?.[1]||""}</textarea><textarea id="elogio3" placeholder="Elogio 3">${data.elogios?.[2]||""}</textarea></div>
            <div class="section"><h3>Gratidão</h3><textarea id="gratidao1" placeholder="Gratidão 1">${data.gratidao?.[0]||""}</textarea><textarea id="gratidao2" placeholder="Gratidão 2">${data.gratidao?.[1]||""}</textarea><textarea id="gratidao3" placeholder="Gratidão 3">${data.gratidao?.[2]||""}</textarea></div></div>
            <div class="section"><h3>Sofá da Preguiça</h3><textarea id="sofaPreguica" placeholder="O que procrastinei?">${data.sofa_preguica||""}</textarea></div>
            <div class="section"><h3>HD Sigiloso</h3><textarea id="hdSigiloso" placeholder="Carta...">${data.hd_sigiloso||""}</textarea></div>
        `;
        document.getElementById('exercicioBtn')?.addEventListener('click', () => {
            const exs = ["Escreva sobre um momento que se sentiu orgulhosa", "Descreva uma situação de ansiedade", "Escreva uma carta de perdão"];
            let exercicio = exs[Math.floor(Math.random() * exs.length)];
            let div = document.getElementById('exercicioTexto');
            div.innerHTML = exercicio;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 5000);
        });
        document.getElementById('tvSmartBtn')?.addEventListener('click', () => openDiarioModal());
        document.querySelectorAll('.estrela-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.estrela-option').forEach(o=>o.classList.remove('selected'));
                opt.classList.add('selected');
            };
        });
        function capturePage0() {
            if(!users[currentUser]?.diarios?.[currentDate]) return;
            let d = users[currentUser].diarios[currentDate];
            d.reflexao = document.getElementById('reflexaoTexto')?.value || "";
            d.estrela_roteiro = document.getElementById('estrelaRoteiro')?.value || "";
            let sel = document.querySelector('.estrela-option.selected');
            if(sel) d.estrela = sel.dataset.estrela;
            d.elogios = [document.getElementById('elogio1')?.value||"", document.getElementById('elogio2')?.value||"", document.getElementById('elogio3')?.value||""];
            d.gratidao = [document.getElementById('gratidao1')?.value||"", document.getElementById('gratidao2')?.value||"", document.getElementById('gratidao3')?.value||""];
            d.sofa_preguica = document.getElementById('sofaPreguica')?.value || "";
            d.hd_sigiloso = document.getElementById('hdSigiloso')?.value || "";
            d.checklist_fisica = { banho:!!document.getElementById('fis_banho')?.checked, dentes:!!document.getElementById('fis_dentes')?.checked, agua:!!document.getElementById('fis_agua')?.checked, comida:!!document.getElementById('fis_comida')?.checked, sol:!!document.getElementById('fis_sol')?.checked, movimento:!!document.getElementById('fis_movimento')?.checked };
            d.checklist_autocuidado = { medicamentos:!!document.getElementById('auto_med')?.checked, terapia:!!document.getElementById('auto_ter')?.checked, amorProprio:!!document.getElementById('auto_amor')?.checked, limites:!!document.getElementById('auto_lim')?.checked, ajuda:!!document.getElementById('auto_aju')?.checked, detox:!!document.getElementById('auto_detox')?.checked, skincare:!!document.getElementById('auto_skincare')?.checked };
            saveAll();
        }
        document.querySelectorAll('#page0 input, #page0 textarea').forEach(el => {
            if(el.id && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox'))) el.addEventListener('input', capturePage0);
            else if(el.id && el.tagName === 'INPUT' && el.type === 'checkbox') el.addEventListener('change', capturePage0);
        });
    }
    
    function renderPagina1() {
        let data = users[currentUser]?.diarios?.[currentDate] || getEmptyDiary();
        let html = `<div class="section"><h3>Catálogo emocional</h3>`;
        emocoesList.forEach(emo => {
            let e = data.emocoes[emo] || { intensidade:0, gatilho:"", pensamentos:"", outra_forma:"", descricao:"" };
            html += `<div class="emo-acordeon"><div class="emo-header" data-emo="${emo}"><h4>${emo}</h4><span>+</span></div>
                <div class="emo-content" id="emoContent_${emo}">
                    <div><label>Intensidade (0-100%)</label><input type="range" id="emo_int_${emo}" min="0" max="100" value="${e.intensidade}"><span id="emo_val_${emo}">${e.intensidade}%</span></div>
                    <div><label>Gatilho</label><textarea id="emo_gat_${emo}">${e.gatilho}</textarea></div>
                    <div><label>Pensamentos automáticos</label><textarea id="emo_pens_${emo}">${e.pensamentos}</textarea></div>

    function renderPagina7() {
        let roda = users[currentUser]?.diarios?.[currentDate]?.roda_vida || {};

            html += `<div class="diagnost-card"><h4>${areas[i]}</h4><button class="nota-botao" data-area="${i}">Nota</button><span id="nota_${i}">${nota>0?nota+"/10":"-"}</span><textarea id="comentario_${i}" placeholder="Comentário...">${roda[`comentario_${i}`]||""}</textarea></div>`;

        for(let i=0;i<areas.length;i++) {
            let btn = document.querySelector(`.nota-botao[data-area="${i}"]`);
            if(btn) btn.onclick = () => { let nota = prompt("Nota de 1 a 10:", "5"); if(nota && nota>=1 && nota<=10) { document.getElementById(`nota_${i}`).innerText = nota+"/10"; } };
            let ta = document.getElementById(`comentario_${i}`);
            if(ta) ta.addEventListener('input', () => { if(users[currentUser].diarios[currentDate]) { if(!users[currentUser].diarios[currentDate].roda_vida) users[currentUser].diarios[currentDate].roda_vida = {}; users[currentUser].diarios[currentDate].roda_vida[`comentario_${i}`] = ta.value; saveAll(); } });
        }
        document.getElementById('salvarRodaBtn')?.addEventListener('click', () => {
            for(let i=0;i<areas.length;i++) {
                let notaSpan = document.getElementById(`nota_${i}`);
                let nota = parseInt(notaSpan.innerText);
                if(!isNaN(nota) && users[currentUser].diarios[currentDate]) {
                    if(!users[currentUser].diarios[currentDate].roda_vida) users[currentUser].diarios[currentDate].roda_vida = {};
                    users[currentUser].diarios[currentDate].roda_vida[i] = nota;
                }

                <div class="intersecao-card" data-tipo="profissao"><h4>PROFISSÃO</h4><div class="clicar">Clique para ver</div><div class="resultado-texto"></div></div>

                if(tipo === "paixao") resultado = `Paixão: ${ama} + ${boa}`;

                if(tipo === "profissao") resultado = `Profissão: ${boa} + ${paga}`;

                card.querySelector('.resultado-texto').style.display = 'block';

            if(d) { d.ikigai.respostas = { ama:document.getElementById('ikigai_ama').value, boa:document.getElementById('ikigai_boa').value, mundo:document.getElementById('ikigai_mundo').value, paga:document.getElementById('ikigai_paga').value }; d.ikigai_data = new Date().toISOString(); saveAll(); alert("IKIGAI salvo!"); renderIkigai(); }
        });

    function renderArquivos() {
        let diarios = users[currentUser]?.diarios || {};
        let dates = Object.keys(diarios).sort().reverse();
        let html = `<div class="vhs-container">`;
        dates.forEach(d => {
            let entry = diarios[d];
            html += `<div class="vhs-card" data-data="${d}"><div class="vhs-header"><div class="vhs-date">${d}</div><button class="edit-vhs" data-data="${d}">Editar</button><button class="delete-vhs" data-data="${d}">Excluir</button></div>
            <div class="vhs-content" id="vhs-${d.replace(/-/g,'')}"><div class="vhs-content-item"><strong>Diário:</strong> ${entry?.diario_texto || "---"}</div><textarea id="edit-${d.replace(/-/g,'')}" style="display:none; width:100%; margin-top:0.5rem;">${entry?.diario_texto||""}</textarea><button class="save-vhs" data-data="${d}" style="display:none;">Salvar</button></div></div>`;
        });
        html += `</div>`;
        document.getElementById('page9').innerHTML = html;
        
        document.querySelectorAll('.vhs-card').forEach(card => {
            let data = card.dataset.data;
            card.onclick = (e) => { if(!e.target.classList.contains('edit-vhs') && !e.target.classList.contains('delete-vhs') && !e.target.classList.contains('save-vhs')) { let c = document.getElementById(`vhs-${data.replace(/-/g,'')}`); if(c) c.classList.toggle('open'); } };
            let editBtn = card.querySelector('.edit-vhs');
            let deleteBtn = card.querySelector('.delete-vhs');
            let contentDiv = document.getElementById(`vhs-${data.replace(/-/g,'')}`);
            let textarea = document.getElementById(`edit-${data.replace(/-/g,'')}`);
            let saveBtn = card.querySelector('.save-vhs');
            if(editBtn) editBtn.onclick = (e) => { e.stopPropagation(); textarea.style.display = 'block'; saveBtn.style.display = 'inline-block'; };
            if(saveBtn) saveBtn.onclick = (e) => { e.stopPropagation(); if(users[currentUser].diarios[data]) { users[currentUser].diarios[data].diario_texto = textarea.value; saveAll(); alert("Salvo!"); textarea.style.display = 'none'; saveBtn.style.display = 'none'; renderArquivos(); } };
            if(deleteBtn) deleteBtn.onclick = (e) => { e.stopPropagation(); if(confirm("Excluir?")) { delete users[currentUser].diarios[data]; saveAll(); renderArquivos(); } };
        });
    }
    
    function loadAll() {
        if(!users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate] = getEmptyDiary();
        let select = document.getElementById('historySelect');
        if(select) {
            let dates = Object.keys(users[currentUser].diarios).sort().reverse();
            select.innerHTML = '<option value="hoje">Hoje</option>';
            dates.forEach(d => { if(d !== new Date().toISOString().slice(0,10)) select.innerHTML += `<option value="${d}">${d}</option>`; });
            select.value = currentDate === new Date().toISOString().slice(0,10) ? "hoje" : currentDate;
        }
    }
    
    function initDashboard() {
        let today = new Date().toISOString().slice(0,10);
        if(!users[currentUser].diarios) users[currentUser].diarios = {};
        if(!users[currentUser].diarios[today]) users[currentUser].diarios[today] = getEmptyDiary();
        currentDate = today;
        loadAll();
        document.getElementById('currentUserDisplay').innerText = currentUser;
        document.getElementById('avatarBtn').innerText = currentUser.charAt(0).toUpperCase();
        document.getElementById('saveEntryBtn').onclick = () => { if(users[currentUser].diarios[currentDate]) users[currentUser].diarios[currentDate].salvo = true; saveAll(); alert("Salvo!"); renderPagina0(); };
        document.getElementById('historySelect').onchange = (e) => { let val = e.target.value === "hoje" ? new Date().toISOString().slice(0,10) : e.target.value; currentDate = val; loadAll(); };
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; document.getElementById('dashboard').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; };
        let nav = document.getElementById('pageNav');
        nav.innerHTML = pageNames.map((n,i) => `<button class="page-btn" data-page="${i}">${n}</button>`).join('');
        document.querySelectorAll('.page-btn').forEach(btn => { btn.onclick = () => changePage(parseInt(btn.dataset.page)); });
        let avatarBtn = document.getElementById('avatarBtn');
        let menu = document.getElementById('avatarMenu');
        avatarBtn.onclick = (e) => { e.stopPropagation(); menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex'; };
        document.addEventListener('click', () => menu.style.display = 'none');
        document.getElementById('uploadAvatarBtn').onclick = () => document.getElementById('avatarUpload').click();
        document.getElementById('avatarUpload').onchange = (e) => { let file = e.target.files[0]; if(file) { let reader = new FileReader(); reader.onload = ev => { users[currentUser].fotoPerfil = ev.target.result; saveAll(); avatarBtn.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100%; object-fit:cover;">`; }; reader.readAsDataURL(file); } };
        document.getElementById('removeAvatarBtn').onclick = () => { delete users[currentUser].fotoPerfil; saveAll(); avatarBtn.innerText = currentUser.charAt(0).toUpperCase(); };
        changePage(0);
    }
    
    let isLoginMode = true;
    function handleLogin() {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        if(!user || !pass) { document.getElementById('loginError').innerText = "Preencha usuário e senha."; return; }
        if(isLoginMode) {
            if(users[user] && users[user].senha === pass) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            } else { document.getElementById('loginError').innerText = "Usuário ou senha incorretos."; }
        } else {
            if(users[user]) { document.getElementById('loginError').innerText = "Usuário já existe."; }
            else {
                users[user] = { senha: pass, diarios: {} };
                localStorage.setItem('netpsi_users', JSON.stringify(users));
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            }
        }
    }
    document.getElementById('submitBtn').onclick = handleLogin;
    document.getElementById('loginPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('loginUser').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('switchBtn').onclick = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('formTitle').innerText = isLoginMode ? "Entrar na sua temporada" : "Criar sua temporada";
        document.getElementById('submitBtn').innerText = isLoginMode ? "Entrar" : "Criar conta";
        document.getElementById('switchBtn').innerText = isLoginMode ? "Criar sua temporada" : "Já tenho conta";
        document.getElementById('loginError').innerText = "";
    };
</script>
