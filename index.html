<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetPsi - Produtora Rute Kautscher</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --n-red: #E50914; --text: #ffffff; }
        body {
            font-family: 'Roboto', sans-serif; margin: 0; min-height: 100vh; color: var(--text);
            background: linear-gradient(-45deg, #000000, #1a0000, #001a33, #1a0033, #000000);
            background-size: 400% 400%; animation: gradientBG 10s ease infinite;
            background-attachment: fixed; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container { width: 95%; max-width: 1200px; padding: 20px 10px; position: relative; box-sizing: border-box; }
        .sidebar-profiles { position: static; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        @media (min-width: 1024px) { .sidebar-profiles { position: absolute; top: 20px; right: 0; flex-direction: column; } }
        .perfil-box { width: 45px; height: 45px; background: #2b2b2b; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: bold; border: 2px solid transparent; }
        .perfil-box.azul { background: #1a73e8; } .perfil-box.vermelho { background: #e50914; } .perfil-box.verde { background: #4caf50; }
        .logo-main { font-family: 'Bebas Neue', cursive; font-size: 4rem; color: var(--n-red); text-align: center; margin: 0; filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.9)); }
        .credito-mini { color: #fff; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-top: -5px; margin-bottom: 30px; font-size: 0.8rem; }
        .card-netflix { background-color: rgba(10, 10, 10, 0.9); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, textarea, select { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #333; background: #080808; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn-netflix { background-color: var(--n-red); color: white; border: none; padding: 18px; border-radius: 4px; cursor: pointer; font-weight: 700; text-transform: uppercase; width: 100%; font-size: 1rem; }
        label { font-weight: 700; color: #fff; margin-top: 20px; display: block; text-transform: uppercase; border-left: 5px solid var(--n-red); padding-left: 15px; }
        .tcc-entry { background: rgba(20, 20, 20, 0.8); padding: 20px; border-radius: 6px; margin-top: 15px; border: 1px solid #222; }
        .valor-emocao { color: var(--n-red); font-weight: bold; float: right; font-size: 1.2rem; }
        .retangulo-netflix { background: var(--n-red); padding: 25px; margin: 30px 0; font-family: 'Bebas Neue'; font-size: 1.4rem; text-align: center; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div id="auth-section">
        <h1 class="logo-main">NETPSI</h1>
        <div class="credito-mini">PRODUTORA RUTE KAUTSCHER</div>
        <div class="card-netflix" style="max-width: 400px; margin: auto; text-align:center;">
            <p>SISTEMA RESTAURADO</p>
            <button class="btn-netflix" onclick="realizarLogin()">ENTRAR NO SET</button>
        </div>
    </div>
    <div id="main-content" style="display:none;">
        <div class="sidebar-profiles" id="historico-sidebar"></div>
        <h1 class="logo-main" style="font-size: 3rem;">NETPSI</h1>
        <div class="card-netflix">
            <label>Ingresso de Hoje</label>
            <button class="btn-netflix" style="background: #333;" onclick="revelarSurpresa()">REVELAR</button>
            <div id="box-surpresa" style="display:none; padding:15px; color:var(--n-red); text-align:center; font-weight:bold;"></div>
        </div>
        <div class="card-netflix">
            <label>Relato do Episódio</label>
            <textarea rows="4" id="relato"></textarea>
        </div>
        <div class="card-netflix"><label>TCC Completo</label><div id="grid-tcc"></div></div>
        <div class="card-netflix"><label>Elogios & Gratidão</label><input type="text" placeholder="Elogio"><input type="text" placeholder="Gratidão"></div>
        <div id="pasta-arquivos" style="margin-top:20px;"><div id="grid-meses" style="display:grid; grid-template-columns: repeat(4,1fr); gap:8px;"></div></div>
        <div class="retangulo-netflix">"O SOFRIMENTO É O LODO ONDE A FLOR DA FELICIDADE CRESCE."<br><small>— Thich Nhat Hanh</small></div>
    </div>
</div>
<script>
    const EMOC_LIST = ["Ansiedade", "Alegria", "Cansaço", "Paz", "Tristeza", "Raiva", "Frustração", "Culpa"];
    function realizarLogin() { document.getElementById('auth-section').style.display='none'; document.getElementById('main-content').style.display='block'; buildTCC(); renderPasta(); }
    function revelarSurpresa() { const b = document.getElementById('box-surpresa'); b.innerText = "CARTA: " + ["Foque no agora.", "Você é capaz.", "Respire.", "Tudo passa."][Math.floor(Math.random()*4)]; b.style.display='block'; }
    function buildTCC(){
        const container = document.getElementById("grid-tcc"); container.innerHTML = "";
        EMOC_LIST.forEach((em, i) => {
            container.innerHTML += `<div class="tcc-entry"><span class="valor-emocao" id="v_${i}">0</span><strong>${em}</strong><input type="range" min="0" max="10" oninput="document.getElementById('v_${i}').innerText=this.value"><input type="text" placeholder="Gatilho"><input type="text" placeholder="Pensamento"><textarea placeholder="Reestruturação"></textarea></div>`;
        });
    }
    function renderPasta() {
        const container = document.getElementById('grid-meses'); container.innerHTML = "";
        ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"].forEach(m => {
            container.innerHTML += `<div style="background:#111; padding:10px; border:1px solid #222; font-size:0.6rem; text-align:center;">${m}</div>`;
        });
    }
</script>
</body>
</html>
